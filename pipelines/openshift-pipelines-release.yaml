---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: one-click-release
  annotations:
    tekton.dev/tags: release
spec:
  workspaces:
    - name: source
  params:
    - name: GITHUB_TOKEN_SECRET
      default: "github-release"
    - name: GITHUB_TOKEN_KEY
      default: "github-token"
    - name: VERSION
    - name: NEW_PATCH
      default: "false"
    # Lets a rerun pick up where a previous one stopped, instead of taking the
    # stages that are already done through again.
    - name: START_FROM
      type: string
      default: "BUILD"
      enum:
        - "CONFIG"
        - "BUILD"
        - "RELEASE"
        - "POST-RELEASE"
      description: >-
        Stage to start at, everything before it is skipped.
        "CONFIG": the whole release, from the release configuration on.
        "BUILD": skip the configuration, start by processing all the PRs and
        building core, bundle and index.
        "RELEASE": skip the build too, start at the core release and release
        what SNAPSHOTS names, or the latest snapshots when it is empty.
        "POST-RELEASE": skip the releases as well, only mirror the index images
        of the releases that already happened.
    - name: SNAPSHOTS
      type: array
      default: []
      description: >-
        Snapshots to release, used from the RELEASE stage on. The core, bundle
        and index snapshots can be passed together in any order, each release
        picks its own by the application label the snapshot carries. The latest
        snapshot of an application is used when the list holds none of it.
    - name: ENVIRONMENT
      default: "devel"
    # The supported set moves between releases, 5-0 exists from 1.24 on and
    # 4-23 is not released for now, so it is read off Konflux by default
    # instead of being kept up to date by hand here.
    - name: OCP_VERSIONS
      type: array
      default: []
      description: >-
        OCP versions to build the index images for, e.g. ["4-14", "5-0"].
        Left empty, the index applications of VERSION are listed and every
        one of them is released.
  tasks:
    - name: configure-release
      when:
      - input: $(params.START_FROM)
        operator: in
        values:
          - "CONFIG"
      - input: $(params.NEW_PATCH)
        operator: in
        values:
          - "true"
      - input: $(params.VERSION)
        operator: notin
        values:
          - "main"
      workspaces:
        - workspace: source
          name: source
      taskRef:
        name: release-config-task
      params:
        - name: VERSION
          value: $(params.VERSION)
        - name: NEW_PATCH
          value: $(params.NEW_PATCH)
        - name: github-token-secret
          value: $(params.GITHUB_TOKEN_SECRET)
        - name: github-token-key
          value: $(params.GITHUB_TOKEN_KEY)
    # The generated Konflux configuration has to land first, the builds of
    # every other PR depend on it.
    - name: process-hack-prs
      when:
        - input: $(params.START_FROM)
          operator: in
          values:
            - "CONFIG"
      runAfter:
        - configure-release
      taskRef:
        name: osp-github-pr-processor
      params:
        - name: SEARCH_LABEL
          value: "hack"
        - name: VERSION
          value: $(params.VERSION)
        - name: github-token-secret
          value: $(params.GITHUB_TOKEN_SECRET)
        - name: github-token-key
          value: $(params.GITHUB_TOKEN_KEY)
    - name: process-pull-requests
      when:
        - input: $(params.START_FROM)
          operator: in
          values:
            - "CONFIG"
            - "BUILD"
      runAfter:
        - process-hack-prs
      taskRef:
        name: osp-github-pr-processor
      params:
        - name: SEARCH_LABEL
          value: "hack,upstream,mintmaker,one-click-release,automated"
        # Nudge PRs are processed later, once the core snapshot is ready
        - name: EXCLUDE_LABEL
          value: "konflux-nudge"
        - name: VERSION
          value: $(params.VERSION)
        - name: github-token-secret
          value: $(params.GITHUB_TOKEN_SECRET)
        - name: github-token-key
          value: $(params.GITHUB_TOKEN_KEY)
    - name: wait-for-core-snapshot
      when:
        - input: $(params.START_FROM)
          operator: in
          values:
            - "CONFIG"
            - "BUILD"
            - "RELEASE"
      runAfter:
        - process-pull-requests
      taskRef:
        name: wait-for-snapshot
      params:
        - name: VERSION
          value: $(params.VERSION)
        - name: APP
          value: core
        - name: github-token-secret
          value: $(params.GITHUB_TOKEN_SECRET)
        - name: github-token-key
          value: $(params.GITHUB_TOKEN_KEY)
    - name: release-core
      when:
        - input: $(params.START_FROM)
          operator: in
          values:
            - "CONFIG"
            - "BUILD"
            - "RELEASE"
        - input: $(params.ENVIRONMENT)
          operator: in
          values:
            - "stage"
            - "prod"
      runAfter:
        - wait-for-core-snapshot
      taskRef:
        name: konflux-release-task
      params:
        - name: APPLICATION
          value: core
        - name: ENVIRONMENT
          value: $(params.ENVIRONMENT)
        - name: VERSION
          value: $(params.VERSION)
        - name: SNAPSHOTS
          value:
            - $(params.SNAPSHOTS[*])
    - name: update-project-yaml
      when:
        - input: $(params.START_FROM)
          operator: in
          values:
            - "CONFIG"
            - "BUILD"
      runAfter:
        - wait-for-core-snapshot
      taskRef:
        name: update-project-yaml-task
      params:
        - name: VERSION
          value: $(params.VERSION)
        - name: SNAPSHOT
          value: $(tasks.wait-for-core-snapshot.results.snapshot)
        - name: github-token-secret
          value: $(params.GITHUB_TOKEN_SECRET)
        - name: github-token-key
          value: $(params.GITHUB_TOKEN_KEY)
    # Merge the project.yaml update, the bundle is built from it
    - name: process-project-yaml-pr
      when:
        - input: $(params.START_FROM)
          operator: in
          values:
            - "CONFIG"
            - "BUILD"
      runAfter:
        - update-project-yaml
      taskRef:
        name: osp-github-pr-processor
      params:
        # Target the generated PR only, by the branch it was opened from
        - name: HEAD_BRANCH
          value: $(tasks.update-project-yaml.results.pr-branch)
        - name: SEARCH_LABEL
          value: ""
        - name: VERSION
          value: $(params.VERSION)
        - name: github-token-secret
          value: $(params.GITHUB_TOKEN_SECRET)
        - name: github-token-key
          value: $(params.GITHUB_TOKEN_KEY)
    # The bundle is built from project.yaml, so right before building it, check
    # that project.yaml still holds exactly the digests of the core snapshot
    # that was released, and not something another merge moved it to. Reads the
    # snapshot off release-core rather than wait-for-core-snapshot, those differ
    # as soon as SNAPSHOTS pins an older one or a newer build lands meanwhile.
    # A no-op when nothing drifted, it opens a pull request when it did.
    - name: verify-project-yaml
      when:
        - input: $(params.START_FROM)
          operator: in
          values:
            - "CONFIG"
            - "BUILD"
            - "RELEASE"
      runAfter:
        - release-core
        - process-project-yaml-pr
      taskRef:
        name: update-project-yaml-task
      params:
        - name: VERSION
          value: $(params.VERSION)
        - name: SNAPSHOT
          value: $(tasks.release-core.results.snapshot)
        # Its own branch, so that it never force pushes over the branch of the
        # update above while that pull request is still open
        - name: PR_BRANCH
          value: "one-click-release/$(params.VERSION)/verify-project-yaml"
        - name: github-token-secret
          value: $(params.GITHUB_TOKEN_SECRET)
        - name: github-token-key
          value: $(params.GITHUB_TOKEN_KEY)
    # Merges the correction when project.yaml had drifted, a no-op otherwise
    - name: process-verify-project-yaml-pr
      when:
        - input: $(params.START_FROM)
          operator: in
          values:
            - "CONFIG"
            - "BUILD"
            - "RELEASE"
      runAfter:
        - verify-project-yaml
      taskRef:
        name: osp-github-pr-processor
      params:
        - name: HEAD_BRANCH
          value: $(tasks.verify-project-yaml.results.pr-branch)
        - name: SEARCH_LABEL
          value: ""
        - name: VERSION
          value: $(params.VERSION)
        - name: github-token-secret
          value: $(params.GITHUB_TOKEN_SECRET)
        - name: github-token-key
          value: $(params.GITHUB_TOKEN_KEY)
    # The CSV is generated from project.yaml. The operator-update-images
    # workflow does this on the merge of the project.yaml pull request, but it
    # is queued, and the bundle build regularly wins that race and ships a CSV
    # with the previous digests. Running it here, every time, puts it in
    # sequence. It pushes to the branch the workflow uses, so the two converge
    # on one pull request rather than competing.
    - name: update-operator-csv
      when:
        - input: $(params.START_FROM)
          operator: in
          values:
            - "CONFIG"
            - "BUILD"
            - "RELEASE"
      runAfter:
        - process-project-yaml-pr
        - process-verify-project-yaml-pr
      taskRef:
        name: operator-update-csv-task
      params:
        - name: VERSION
          value: $(params.VERSION)
        - name: OLM_ENVIRONMENT
          value: $(params.ENVIRONMENT)
        - name: github-token-secret
          value: $(params.GITHUB_TOKEN_SECRET)
        - name: github-token-key
          value: $(params.GITHUB_TOKEN_KEY)
    - name: process-operator-csv-pr
      when:
        - input: $(params.START_FROM)
          operator: in
          values:
            - "CONFIG"
            - "BUILD"
            - "RELEASE"
      runAfter:
        - update-operator-csv
      taskRef:
        name: osp-github-pr-processor
      params:
        - name: HEAD_BRANCH
          value: $(tasks.update-operator-csv.results.pr-branch)
        - name: SEARCH_LABEL
          value: ""
        - name: VERSION
          value: $(params.VERSION)
        - name: github-token-secret
          value: $(params.GITHUB_TOKEN_SECRET)
        - name: github-token-key
          value: $(params.GITHUB_TOKEN_KEY)
    - name: wait-for-bundle-snapshot
      when:
        - input: $(params.START_FROM)
          operator: in
          values:
            - "CONFIG"
            - "BUILD"
            - "RELEASE"
      runAfter:
        - process-operator-csv-pr
      taskRef:
        name: wait-for-snapshot
      params:
        - name: VERSION
          value: $(params.VERSION)
        - name: APP
          value: bundle
        - name: github-token-secret
          value: $(params.GITHUB_TOKEN_SECRET)
        - name: github-token-key
          value: $(params.GITHUB_TOKEN_KEY)
    # Same as project.yaml, but the bundle image reference of bundle.yaml,
    # taken from the bundle snapshot. The index images are built from it.
    - name: update-bundle-yaml
      when:
        - input: $(params.START_FROM)
          operator: in
          values:
            - "CONFIG"
            - "BUILD"
            - "RELEASE"
      runAfter:
        - release-bundle
      taskRef:
        name: update-project-yaml-task
      params:
        - name: VERSION
          value: $(params.VERSION)
        - name: SNAPSHOT
          value: $(tasks.wait-for-bundle-snapshot.results.snapshot)
        - name: PROJECT_FILE
          value: "bundle.yaml"
        - name: github-token-secret
          value: $(params.GITHUB_TOKEN_SECRET)
        - name: github-token-key
          value: $(params.GITHUB_TOKEN_KEY)
    - name: release-bundle
      when:
        - input: $(params.START_FROM)
          operator: in
          values:
            - "CONFIG"
            - "BUILD"
            - "RELEASE"
        - input: $(params.ENVIRONMENT)
          operator: in
          values:
            - "stage"
            - "prod"
      runAfter:
        - wait-for-bundle-snapshot
      taskRef:
        name: konflux-release-task
      params:
        - name: APPLICATION
          value: bundle
        - name: ENVIRONMENT
          value: $(params.ENVIRONMENT)
        - name: VERSION
          value: $(params.VERSION)
        - name: SNAPSHOTS
          value:
            - $(params.SNAPSHOTS[*])
    # Merged only once the bundle is released, it is what nudges the index builds
    - name: process-bundle-yaml-pr
      when:
        - input: $(params.START_FROM)
          operator: in
          values:
            - "CONFIG"
            - "BUILD"
            - "RELEASE"
      runAfter:
        - update-bundle-yaml
      taskRef:
        name: osp-github-pr-processor
      params:
        - name: HEAD_BRANCH
          value: $(tasks.update-bundle-yaml.results.pr-branch)
        - name: SEARCH_LABEL
          value: ""
        - name: VERSION
          value: $(params.VERSION)
        - name: github-token-secret
          value: $(params.GITHUB_TOKEN_SECRET)
        - name: github-token-key
          value: $(params.GITHUB_TOKEN_KEY)
    # The catalog is rendered from bundle.yaml. Same story as the CSV: the
    # render-olm-catalog workflow is queued on the bundle.yaml merge and the
    # index build can start before the rendered catalog has landed. Run it
    # here, every time, so the index is built from a current catalog.
    - name: render-olm-catalog
      when:
        - input: $(params.START_FROM)
          operator: in
          values:
            - "CONFIG"
            - "BUILD"
            - "RELEASE"
      runAfter:
        - process-bundle-yaml-pr
      taskRef:
        name: operator-render-catalog-task
      params:
        - name: VERSION
          value: $(params.VERSION)
        - name: OLM_ENVIRONMENT
          value: $(params.ENVIRONMENT)
        - name: github-token-secret
          value: $(params.GITHUB_TOKEN_SECRET)
        - name: github-token-key
          value: $(params.GITHUB_TOKEN_KEY)
    - name: process-olm-catalog-pr
      when:
        - input: $(params.START_FROM)
          operator: in
          values:
            - "CONFIG"
            - "BUILD"
            - "RELEASE"
      runAfter:
        - render-olm-catalog
      taskRef:
        name: osp-github-pr-processor
      params:
        - name: HEAD_BRANCH
          value: $(tasks.render-olm-catalog.results.pr-branch)
        - name: SEARCH_LABEL
          value: ""
        - name: VERSION
          value: $(params.VERSION)
        - name: github-token-secret
          value: $(params.GITHUB_TOKEN_SECRET)
        - name: github-token-key
          value: $(params.GITHUB_TOKEN_KEY)
    - name: wait-for-fbc-snapshot
      when:
        - input: $(params.START_FROM)
          operator: in
          values:
            - "CONFIG"
            - "BUILD"
            - "RELEASE"
      runAfter:
        - process-olm-catalog-pr
      taskRef:
        name: wait-for-snapshot
      params:
        - name: VERSION
          value: $(params.VERSION)
        - name: APP
          value: index
        - name: github-token-secret
          value: $(params.GITHUB_TOKEN_SECRET)
        - name: github-token-key
          value: $(params.GITHUB_TOKEN_KEY)
    # The index releases fan out over this, so it is resolved right before
    # them, once the configuration that creates the applications has landed.
    - name: list-index-applications
      when:
        - input: $(params.START_FROM)
          operator: in
          values:
            - "CONFIG"
            - "BUILD"
            - "RELEASE"
        - input: $(params.ENVIRONMENT)
          operator: in
          values:
            - "stage"
            - "prod"
      runAfter:
        - wait-for-fbc-snapshot
      taskRef:
        name: list-index-applications
      params:
        - name: VERSION
          value: $(params.VERSION)
        - name: OCP_VERSIONS
          value:
            - $(params.OCP_VERSIONS[*])
    - name: release-fbc
      when:
        - input: $(params.START_FROM)
          operator: in
          values:
            - "CONFIG"
            - "BUILD"
            - "RELEASE"
        - input: $(params.ENVIRONMENT)
          operator: in
          values:
            - "stage"
            - "prod"
      runAfter:
        - wait-for-fbc-snapshot
      matrix:
        params:
          - name: APPLICATION
            value: $(tasks.list-index-applications.results.ocp-versions[*])
      params:
        - name: ENVIRONMENT
          value: $(params.ENVIRONMENT)
        - name: VERSION
          value: $(params.VERSION)
        - name: SNAPSHOTS
          value:
            - $(params.SNAPSHOTS[*])
      taskRef:
        name: konflux-release-task
    # The released index images sit on an internal registry, mirror them to a
    # publicly readable Quay repository. Every fanned out release of the
    # matrixed release-fbc task is handed over as one array, no matrix here.
    - name: copy-fbc-index-images
      when:
        - input: $(params.START_FROM)
          operator: notin
          values:
            - "POST-RELEASE"
        - input: $(params.ENVIRONMENT)
          operator: in
          values:
            - "stage"
      runAfter:
        - release-fbc
      params:
        - name: RELEASES
          value:
            - $(tasks.release-fbc.results.release[*])
        - name: VERSION
          value: $(params.VERSION)
        - name: ENVIRONMENT
          value: $(params.ENVIRONMENT)
      taskRef:
        name: copy-fbc-index-task
    # Same mirroring, for the run that starts at POST-RELEASE. release-fbc is
    # skipped there, and a task consuming the results of a skipped task is
    # skipped too, so the releases cannot come from it. The task looks up the
    # latest successful index release of the version instead.
    - name: copy-fbc-index-images-post-release
      when:
        - input: $(params.START_FROM)
          operator: in
          values:
            - "POST-RELEASE"
        - input: $(params.ENVIRONMENT)
          operator: in
          values:
            - "stage"
      params:
        - name: VERSION
          value: $(params.VERSION)
        - name: ENVIRONMENT
          value: $(params.ENVIRONMENT)
      taskRef:
        name: copy-fbc-index-task
    # Runs in every stage, last. It reads the released state off the cluster
    # instead of the results of the release tasks, which are skipped in a
    # POST-RELEASE run and would take this with them.
    - name: release-summary
      runAfter:
        - copy-fbc-index-images
        - copy-fbc-index-images-post-release
      taskRef:
        name: release-summary-task
      params:
        - name: VERSION
          value: $(params.VERSION)
        - name: ENVIRONMENT
          value: $(params.ENVIRONMENT)
