---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: konflux-release
  annotations:
    tekton.dev/tags: release
spec:
  workspaces:
    - name: source
  params:
    - name: VERSION
    - name: NEW_PATCH
      default: "false"
    - name: ENVIRONMENT
      type: string
      default: "devel"
    - name: OCP_VERSIONS
      default:
        - 4-14
        - 4-16
        - 4-18
        - 4-19
        - 4-20
        - 4-21
        - 4-22
        - 4-23
        - 5-0
  tasks:
    - name: configure-release
      when:
        - input: $(params.NEW_PATCH)
          operator: in
          values:
            - "true"
      workspaces:
        - workspace: source
          name: source
      taskRef:
        name: release-config-task
      params:
        - name: VERSION
          value: $(params.VERSION)
        - name: NEW_PATCH
          value: $(params.NEW_PATCH)

    - name: process-pull-requests
      runAfter:
        - configure-release
      taskRef:
        name: osp-github-pr-processor
      params:
        - name: SEARCH_LABEL
          value: "hack"
        - name: VERSION
          value: $(params.VERSION)
        - name: github-token-secret
          value: my-github-secret
        - name: github-token-key
          value: token

    - name: release-core
      when:
        - input: $(params.ENVIRONMENT)
          operator: in
          values:
            - "stage"
            - "prod"
      runAfter:
        - process-pull-requests
      taskRef:
        name: konflux-release-task
      params:
        - name: APPLICATION
          value: core
        - name: ENVIRONMENT
          value: $(params.ENVIRONMENT)
        - name: VERSION
          value: $(params.VERSION)

    - name: release-bundle
      when:
        - input: $(params.ENVIRONMENT)
          operator: in
          values:
            - "stage"
            - "prod"
      runAfter:
        - release-core
      taskRef:
        name: konflux-release-task
      params:
        - name: APPLICATION
          value: bundle
        - name: ENVIRONMENT
          value: $(params.ENVIRONMENT)
        - name: VERSION
          value: $(params.VERSION)
    - name: release-fbc
      when:
        - input: $(params.ENVIRONMENT)
          operator: in
          values:
            - "stage"
            - "prod"
      runAfter:
        - release-bundle
      matrix:
        params:
        - name: APPLICATION
          value:
            - $(params.OCP_VERSIONS)
      params:
        - name: ENVIRONMENT
          value: $(params.ENVIRONMENT)
        - name: VERSION
          value: $(params.VERSION)
      taskRef:
        name: konflux-release-task

