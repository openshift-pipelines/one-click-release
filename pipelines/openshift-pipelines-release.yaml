---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: one-click-release
  annotations:
    tekton.dev/tags: release
spec:
  workspaces:
    - name: source
  params:
    - name: GITHUB_TOKEN_SECRET
      default: "github-release"
    - name: GITHUB_TOKEN_KEY
      default: "github-token"
    - name: VERSION
    - name: NEW_PATCH
      default: "false"
    - name: ENVIRONMENT
      default: "devel"
    - name: OCP_VERSIONS
      default:
        - 4-14
        - 4-16
        - 4-18
        - 4-19
        - 4-20
        - 4-21
        - 4-22
        - 4-23
        - 5-0
  tasks:
    - name: configure-release
      when:
      - input: $(params.NEW_PATCH)
        operator: in
        values:
          - "true"
      - input: $(params.VERSION)
        operator: notin
        values:
          - "main"
      workspaces:
        - workspace: source
          name: source
      taskRef:
        name: release-config-task
      params:
        - name: VERSION
          value: $(params.VERSION)
        - name: NEW_PATCH
          value: $(params.NEW_PATCH)
        - name: github-token-secret
          value: $(params.GITHUB_TOKEN_SECRET)
        - name: github-token-key
          value: $(params.GITHUB_TOKEN_KEY)
    # The generated Konflux configuration has to land first, the builds of
    # every other PR depend on it.
    - name: process-hack-prs
      runAfter:
        - configure-release
      taskRef:
        name: osp-github-pr-processor
      params:
        - name: SEARCH_LABEL
          value: "hack"
        - name: VERSION
          value: $(params.VERSION)
        - name: github-token-secret
          value: $(params.GITHUB_TOKEN_SECRET)
        - name: github-token-key
          value: $(params.GITHUB_TOKEN_KEY)
    - name: process-pull-requests
      runAfter:
        - process-hack-prs
      taskRef:
        name: osp-github-pr-processor
      params:
        - name: SEARCH_LABEL
          value: "hack,upstream,mintmaker,one-click-release,automated"
        # Nudge PRs are processed later, once the core snapshot is ready
        - name: EXCLUDE_LABEL
          value: "konflux-nudge"
        - name: VERSION
          value: $(params.VERSION)
        - name: github-token-secret
          value: $(params.GITHUB_TOKEN_SECRET)
        - name: github-token-key
          value: $(params.GITHUB_TOKEN_KEY)
    - name: wait-for-core-snapshot
      runAfter:
        - process-pull-requests
      taskRef:
        name: wait-for-snapshot
      params:
        - name: VERSION
          value: $(params.VERSION)
        - name: APP
          value: core
        - name: github-token-secret
          value: $(params.GITHUB_TOKEN_SECRET)
        - name: github-token-key
          value: $(params.GITHUB_TOKEN_KEY)
    - name: release-core
      when:
        - input: $(params.ENVIRONMENT)
          operator: in
          values:
            - "stage"
            - "prod"
      runAfter:
        - wait-for-core-snapshot
      taskRef:
        name: konflux-release-task
      params:
        - name: APPLICATION
          value: core
        - name: ENVIRONMENT
          value: $(params.ENVIRONMENT)
        - name: VERSION
          value: $(params.VERSION)
    - name: update-project-yaml
      runAfter:
        - wait-for-core-snapshot
      taskRef:
        name: update-project-yaml-task
      params:
        - name: VERSION
          value: $(params.VERSION)
        - name: SNAPSHOT
          value: $(tasks.wait-for-core-snapshot.results.snapshot)
        - name: github-token-secret
          value: $(params.GITHUB_TOKEN_SECRET)
        - name: github-token-key
          value: $(params.GITHUB_TOKEN_KEY)
    # Merge the project.yaml update, the bundle is built from it
    - name: process-project-yaml-pr
      runAfter:
        - update-project-yaml
      taskRef:
        name: osp-github-pr-processor
      params:
        # Target the generated PR only, by the branch it was opened from
        - name: HEAD_BRANCH
          value: $(tasks.update-project-yaml.results.pr-branch)
        - name: SEARCH_LABEL
          value: ""
        - name: VERSION
          value: $(params.VERSION)
        - name: github-token-secret
          value: $(params.GITHUB_TOKEN_SECRET)
        - name: github-token-key
          value: $(params.GITHUB_TOKEN_KEY)
    - name: wait-for-bundle-snapshot
      runAfter:
        - process-project-yaml-pr
      taskRef:
        name: wait-for-snapshot
      params:
        - name: VERSION
          value: $(params.VERSION)
        - name: APP
          value: bundle
        - name: github-token-secret
          value: $(params.GITHUB_TOKEN_SECRET)
        - name: github-token-key
          value: $(params.GITHUB_TOKEN_KEY)
    # Same as project.yaml, but the bundle image reference of bundle.yaml,
    # taken from the bundle snapshot. The index images are built from it.
    - name: update-bundle-yaml
      runAfter:
        - wait-for-bundle-snapshot
      taskRef:
        name: update-project-yaml-task
      params:
        - name: VERSION
          value: $(params.VERSION)
        - name: SNAPSHOT
          value: $(tasks.wait-for-bundle-snapshot.results.snapshot)
        - name: PROJECT_FILE
          value: "bundle.yaml"
        - name: github-token-secret
          value: $(params.GITHUB_TOKEN_SECRET)
        - name: github-token-key
          value: $(params.GITHUB_TOKEN_KEY)
    - name: release-bundle
      when:
        - input: $(params.ENVIRONMENT)
          operator: in
          values:
            - "stage"
            - "prod"
      runAfter:
        - wait-for-bundle-snapshot
        - release-core
      taskRef:
        name: konflux-release-task
      params:
        - name: APPLICATION
          value: bundle
        - name: ENVIRONMENT
          value: $(params.ENVIRONMENT)
        - name: VERSION
          value: $(params.VERSION)
    # Merged only once the bundle is released, it is what nudges the index builds
    - name: process-bundle-yaml-pr
      runAfter:
        - update-bundle-yaml
        - release-bundle
      taskRef:
        name: osp-github-pr-processor
      params:
        - name: HEAD_BRANCH
          value: $(tasks.update-bundle-yaml.results.pr-branch)
        - name: SEARCH_LABEL
          value: ""
        - name: VERSION
          value: $(params.VERSION)
        - name: github-token-secret
          value: $(params.GITHUB_TOKEN_SECRET)
        - name: github-token-key
          value: $(params.GITHUB_TOKEN_KEY)
    - name: wait-for-fbc-snapshot
      runAfter:
        - release-bundle
        - process-bundle-yaml-pr
      taskRef:
        name: wait-for-snapshot
      params:
        - name: VERSION
          value: $(params.VERSION)
        - name: APP
          value: index
        - name: github-token-secret
          value: $(params.GITHUB_TOKEN_SECRET)
        - name: github-token-key
          value: $(params.GITHUB_TOKEN_KEY)
    - name: release-fbc
      when:
        - input: $(params.ENVIRONMENT)
          operator: in
          values:
            - "stage"
            - "prod"
      runAfter:
        - wait-for-fbc-snapshot
      matrix:
        params:
          - name: APPLICATION
            value:
              - $(params.OCP_VERSIONS)
      params:
        - name: ENVIRONMENT
          value: $(params.ENVIRONMENT)
        - name: VERSION
          value: $(params.VERSION)
      taskRef:
        name: konflux-release-task
