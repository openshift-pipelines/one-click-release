apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: operator-update-csv-task
spec:
  description: >-
    Regenerates the ClusterServiceVersion from project.yaml and opens a pull
    request with it, the same work the operator-update-images GitHub workflow
    does on a push to project.yaml.

    That workflow is kept, but it is only eventually consistent: it is queued
    on the merge of the project.yaml pull request and the bundle build can win
    the race, producing a bundle whose CSV still carries the previous digests.
    Running it here puts the CSV update in the release sequence, before the
    bundle is built.

    It pushes to the same branch as the workflow, so whichever of the two runs
    second updates the existing pull request instead of opening a second one.
  params:
    - name: VERSION
      type: string
      default: "1.22"
      description: "Minor version being released, e.g. 1.22. Decides the release branch"
    - name: REPO
      type: string
      default: "openshift-pipelines/operator"
      description: "Repository holding project.yaml and the CSV"
    - name: OLM_ENVIRONMENT
      type: string
      default: ""
      description: >-
        Registry the CSV references, one of devel, staging, production. Empty
        keeps what olm/release-stage.txt holds, which is what the workflow does
        on a push. Note that passing a value rewrites that file, the script
        treats it as the new state of the branch.
        devel -> quay.io/openshift-pipeline,
        staging -> registry.stage.redhat.io/openshift-pipelines,
        production -> registry.redhat.io/openshift-pipelines
    - name: PR_BRANCH
      type: string
      default: ""
      description: >-
        Branch the pull request is opened from, defaults to the one the
        workflow uses, actions/update/operator-update-images-<base branch>
    - name: LABELS
      type: string
      default: "automated,lgtm,approved"
      description: "Comma separated labels added to the pull request"
    - name: DRY_RUN
      type: string
      default: "false"
      description: "When true the regenerated CSV is only printed, nothing is pushed"
    # The script checks every rewritten reference with skopeo and silently
    # drops the ones it cannot inspect, so a run must carry credentials for
    # whichever registry OLM_ENVIRONMENT selects. All of them are mounted and
    # merged rather than switched, so stage and prod runs both just work.
    - name: registry-auth-secret
      type: string
      default: "stage-pull-secret"
      description: "Pull secret for registry.stage.redhat.io"
    - name: registry-auth-secret-prod
      type: string
      default: "registry-redhat-io-sa"
      description: "Pull secret for registry.redhat.io"
    - name: registry-auth-secret-mirror
      type: string
      default: "components-namespace-pull"
      description: "Pull secret for the Konflux quay repositories"
    - name: registry-auth-key
      type: string
      default: ""
      description: "Key holding the docker config, auto-detected when empty"
    - name: github-token-secret
      type: string
      default: "github-release"
      description: "Name of the secret containing the GitHub token"
    - name: github-token-key
      type: string
      default: "github-token"
      description: "Key of the secret containing the GitHub token"
  volumes:
    - name: github-secret-volume
      secret:
        secretName: $(params.github-token-secret)
    - name: registry-auth
      secret:
        secretName: $(params.registry-auth-secret)
        optional: true
    - name: registry-auth-prod
      secret:
        secretName: $(params.registry-auth-secret-prod)
        optional: true
    - name: registry-auth-mirror
      secret:
        secretName: $(params.registry-auth-secret-mirror)
        optional: true
    - name: shared-bin-dir
      emptyDir: { }
  results:
    - name: pr-url
      description: The pull request updating the CSV, empty when there was nothing to update
      value: $(steps.update-csv.results.pr-url)
    - name: pr-branch
      description: Branch the pull request is opened from, reported even when no pull request was needed
      value: $(steps.update-csv.results.pr-branch)
    - name: changed
      description: 1 when the CSV changed, 0 when it was already up to date
      value: $(steps.update-csv.results.changed)
  stepTemplate:
    image: quay.io/openshift-pipeline/ci
    workingDir: /workspace
    env:
      - name: VERSION
        value: $(params.VERSION)
      - name: REPO
        value: $(params.REPO)
      - name: OLM_ENVIRONMENT
        value: $(params.OLM_ENVIRONMENT)
      - name: PR_BRANCH
        value: $(params.PR_BRANCH)
      - name: LABELS
        value: $(params.LABELS)
      - name: DRY_RUN
        value: $(params.DRY_RUN)
      - name: REGISTRY_AUTH_DIR
        value: /etc/registry-auth
      - name: REGISTRY_AUTH_KEY
        value: $(params.registry-auth-key)
      - name: HOME
        value: /shared-bin
      - name: BIN_DIR
        value: /shared-bin
      - name: PATH
        value: "/shared-bin:/usr/local/bin:/usr/bin"
      - name: GH_TOKEN
        valueFrom:
          secretKeyRef:
            name: $(params.github-token-secret)
            key: $(params.github-token-key)
    volumeMounts:
      - name: shared-bin-dir
        mountPath: /shared-bin
      - name: github-secret-volume
        mountPath: /etc/github
        readOnly: true
      - name: registry-auth
        mountPath: /etc/registry-auth/stage
        readOnly: true
      - name: registry-auth-prod
        mountPath: /etc/registry-auth/prod
        readOnly: true
      - name: registry-auth-mirror
        mountPath: /etc/registry-auth/mirror
        readOnly: true

  steps:
    - name: install-dependencies
      script: |
        echo "# 1. Create a local bin directory if it doesn't already exist"
        mkdir -p $BIN_DIR
        cd  /tmp

        echo "# 2. Fetch the latest version number from GitHub"
        VERSION=$(curl -s "https://api.github.com/repos/cli/cli/releases/latest" | grep '"tag_name":' | sed -E 's/.*"v([^"]+)".*/\1/')


        GH_TAR_BALL=gh_${VERSION}_linux_amd64
        echo "Using gh cli $$GH_TAR_BALL"

        echo "# 3. Download the tarball"
        curl -sLO "https://github.com/cli/cli/releases/download/v${VERSION}/$GH_TAR_BALL.tar.gz"

        echo "# 4. Extract the tarball"
        tar -xf $GH_TAR_BALL.tar.gz

        # 5. Move the 'gh' binary to your local bin folder
        cp "gh_${VERSION}_linux_amd64/bin/gh" $BIN_DIR

        # 6. Clean up the downloaded files
        rm -rf $GH_TAR_BALL*

    - name: update-csv
      results:
        - name: pr-url
        - name: pr-branch
        - name: changed
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        # Determine the branch the release lives on
        if [[ "$VERSION" == "next" || "$VERSION" == "nightly" || "$VERSION" == "main" ]]; then
          BASE_BRANCH="$VERSION"
        else
          BASE_BRANCH="release-v$VERSION.x"
        fi

        if [[ -z "$PR_BRANCH" ]]; then
          # The branch of the operator-update-images workflow, on purpose: when
          # both run, the second one updates that pull request instead of
          # opening a competing one.
          PR_BRANCH="actions/update/operator-update-images-${BASE_BRANCH}"
        fi
        # Reported upfront, the step exits early when there is nothing to update
        echo -n "$PR_BRANCH" > $(step.results.pr-branch.path)

        # The pipeline speaks devel/stage/prod, the scripts speak
        # devel/staging/production. Empty still means "whatever
        # olm/release-stage.txt holds", the behaviour of the workflow.
        case "$OLM_ENVIRONMENT" in
          "")              ;;
          devel)           OLM_ENVIRONMENT=devel ;;
          stage|staging)   OLM_ENVIRONMENT=staging ;;
          prod|production) OLM_ENVIRONMENT=production ;;
          *) echo "ERROR: OLM_ENVIRONMENT='$OLM_ENVIRONMENT' is not one of devel, stage, prod" >&2; exit 1 ;;
        esac

        # ==========================================
        # STEP 1: REGISTRY CREDENTIALS FOR SKOPEO
        # ==========================================
        # hack/operator-update-images.sh runs "skopeo inspect" on every rewritten
        # reference and drops the ones it cannot reach, so missing credentials
        # do not fail, they quietly leave the CSV half updated.
        find_auth() {
          local dir=$1 key=$2 candidate
          [[ -d "$dir" ]] || return 0
          if [[ -n "$key" && -s "$dir/$key" ]]; then
            echo "$dir/$key"
            return
          fi
          for candidate in .dockerconfigjson config.json .dockercfg; do
            if [[ -s "$dir/$candidate" ]]; then
              echo "$dir/$candidate"
              return
            fi
          done
          find "$dir" -maxdepth 1 -type f -size +0 2>/dev/null | head -n1
        }

        export DOCKER_CONFIG="$HOME/.docker"
        export REGISTRY_AUTH_FILE="$DOCKER_CONFIG/config.json"
        mkdir -p "$DOCKER_CONFIG"
        echo '{"auths":{}}' > "$REGISTRY_AUTH_FILE"
        for dir in "$REGISTRY_AUTH_DIR"/*/; do
          [[ -d "$dir" ]] || continue
          AUTH_SRC=$(find_auth "$dir" "$REGISTRY_AUTH_KEY")
          [[ -n "$AUTH_SRC" ]] || continue
          jq -c --slurpfile add <(jq 'if has("auths") then . else {auths: .} end' "$AUTH_SRC") \
            '{auths: (.auths + ($add[0].auths // {}))}' "$REGISTRY_AUTH_FILE" > "$REGISTRY_AUTH_FILE.new"
          mv "$REGISTRY_AUTH_FILE.new" "$REGISTRY_AUTH_FILE"
        done
        echo "🔑 Registries available to skopeo: $(jq -r '.auths | keys | join(", ")' "$REGISTRY_AUTH_FILE")"
        if [[ "$(jq -r '.auths | length' "$REGISTRY_AUTH_FILE")" == "0" ]]; then
          echo "WARNING: no registry credentials mounted, references that cannot be inspected will be left untouched"
        fi

        # ==========================================
        # STEP 2: REGENERATE THE CSV
        # ==========================================
        gh auth setup-git
        REPO_DIR=$(mktemp -d)
        gh repo clone "$REPO" "$REPO_DIR" -- -b "$BASE_BRANCH" --depth 1 --quiet
        cd "$REPO_DIR"

        echo "📌 project.yaml at $(git rev-parse --short HEAD) on $BASE_BRANCH"

        # Empty keeps whatever olm/release-stage.txt holds, the behaviour of the
        # workflow on a push. A value rewrites that file as the script sees it
        # as the new state of the branch.
        if [[ -n "$OLM_ENVIRONMENT" ]]; then
          echo "🎯 Targeting the $OLM_ENVIRONMENT registry, olm/release-stage.txt was $(cat olm/release-stage.txt 2>/dev/null || echo unset)"
        else
          echo "🎯 Targeting the registry of olm/release-stage.txt: $(cat olm/release-stage.txt 2>/dev/null || echo unset)"
        fi

        make ENVIRONMENT="$OLM_ENVIRONMENT" update-reference

        # The same paths the workflow commits
        for path in head .konflux olm; do
          [[ -e "$path" ]] && git add -f "$path"
        done

        if [[ -z $(git status --porcelain --untracked-files=no) ]]; then
          echo "🎉 The CSV is already in sync with project.yaml, nothing to do"
          echo -n "0" > $(step.results.changed.path)
          echo -n "" > $(step.results.pr-url.path)
          exit 0
        fi
        echo -n "1" > $(step.results.changed.path)

        echo "📄 Diff:"
        git --no-pager diff --cached --stat
        git --no-pager diff --cached

        if [[ "$DRY_RUN" == "true" ]]; then
          echo "DRY_RUN is set, not pushing anything"
          echo -n "" > $(step.results.pr-url.path)
          exit 0
        fi

        # ==========================================
        # STEP 3: PUSH AND OPEN A SINGLE PR
        # ==========================================
        git config user.name "One Click Release Bot"
        git config user.email "one-click-release-bot@redhat.com"
        git checkout -b "$PR_BRANCH"
        git commit -m "[bot:$BASE_BRANCH] Update generated Cluster Service Version (CSV)" --quiet
        git push -f origin "$PR_BRANCH" --quiet

        PR_URL=$(gh pr list --repo "$REPO" --base "$BASE_BRANCH" --head "$PR_BRANCH" --state open --json url --jq '.[0].url // empty')
        if [[ -z "$PR_URL" ]]; then
          IFS=',' read -ra LABEL_ARRAY <<< "$LABELS"
          LABEL_ARGS=()
          for label in "${LABEL_ARRAY[@]}"; do
            label=$(xargs <<< "$label")
            [[ -n "$label" ]] || continue
            if [[ -z "$(gh label list --repo "$REPO" --search "$label" --json name -q ".[] | select(.name == \"$label\") | .name")" ]]; then
              gh label create "$label" --repo "$REPO" --color "0E8A16" --description "Auto-created by pipeline" || true
            fi
            LABEL_ARGS+=(--label "$label")
          done

          cat > /tmp/pr-body.md <<EOF
        Regenerates the ClusterServiceVersion from \`project.yaml\`.

        Generated by the one-click-release pipeline, the same update the
        operator-update-images workflow does, run in sequence so that the
        bundle is not built before the CSV is correct.
        EOF

          PR_URL=$(gh pr create --repo "$REPO" \
            --base "$BASE_BRANCH" --head "$PR_BRANCH" \
            "${LABEL_ARGS[@]}" \
            --title "[bot:$BASE_BRANCH] Update generated Cluster Service Version (CSV)" \
            --body-file /tmp/pr-body.md)
          echo "   ✅ Created $PR_URL"
        else
          # The workflow may have opened it first, make sure it can be merged
          gh pr edit "$PR_URL" --add-label "lgtm" --add-label "approved" || true
          echo "   ✅ Updated existing $PR_URL"
        fi

        echo -n "$PR_URL" > $(step.results.pr-url.path)
