apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: operator-render-catalog-task
spec:
  description: >-
    Renders the OLM catalog from bundle.yaml and opens a pull request with it,
    the same work the render-olm-catalog GitHub workflow does on a push to
    bundle.yaml or olm/.

    Like the CSV update, that workflow is queued and the index build can start
    before the rendered catalog has landed. Running it here puts it in the
    release sequence, between the bundle.yaml merge and the index build.

    It pushes to the same branch as the workflow, so whichever of the two runs
    second updates the existing pull request instead of opening a second one.
  params:
    - name: VERSION
      type: string
      default: "1.22"
      description: "Minor version being released, e.g. 1.22. Decides the release branch"
    - name: REPO
      type: string
      default: "openshift-pipelines/operator"
      description: "Repository holding bundle.yaml and the catalog"
    - name: OLM_ENVIRONMENT
      type: string
      default: ""
      description: >-
        Registry the catalog references, one of devel, staging, production.
        Empty keeps what olm/release-stage.txt holds, which is what the
        workflow does on a push. Passing a value rewrites that file.
    - name: OCP_VERSIONS
      type: string
      default: ""
      description: >-
        Single OCP version to render, e.g. 4.14. Empty renders every version
        found under .konflux/olm-catalog/index, which is what the workflow does.
    - name: MIRROR_REGISTRY
      type: string
      default: "quay.io/redhat-user-workloads/tekton-ecosystem-tenant"
      description: >-
        Mirror the released registries are resolved to while rendering. The
        bundle is usually not on registry.redhat.io yet at render time, so the
        catalog is rendered from the Konflux build of the very same digest.
    - name: OPM_VERSION
      type: string
      default: "v1.47.0"
      description: "opm release used to render the catalog, as pinned by the workflow"
    - name: PR_BRANCH
      type: string
      default: ""
      description: >-
        Branch the pull request is opened from, defaults to the one the
        workflow uses, actions/update/operator-update-catalog-<base branch>
    - name: LABELS
      type: string
      default: "automated,lgtm,approved"
      description: "Comma separated labels added to the pull request"
    - name: DRY_RUN
      type: string
      default: "false"
      description: "When true the rendered catalog is only summarised, nothing is pushed"
    # Three of them, merged into one auth file. The render reads the published
    # bundles off registry.redhat.io and registry.stage.redhat.io to work out
    # the channels, and the bundle of this release off the Konflux mirror,
    # and no single secret in the namespace covers all three. Mirrors are no
    # help for the first part: the catalog template is generated by a Go
    # program using go-containerregistry, which does not read registries.conf.
    - name: registry-auth-secret
      type: string
      default: "stage-pull-secret"
      description: "Pull secret for registry.stage.redhat.io"
    - name: registry-auth-secret-prod
      type: string
      default: "registry-redhat-io-sa"
      description: "Pull secret for registry.redhat.io, where the released bundles live"
    - name: registry-auth-secret-mirror
      type: string
      default: "components-namespace-pull"
      description: "Pull secret for MIRROR_REGISTRY, the Konflux build of the bundle"
    - name: registry-auth-key
      type: string
      default: ""
      description: "Key holding the docker config, auto-detected when empty"
    - name: github-token-secret
      type: string
      default: "github-release"
      description: "Name of the secret containing the GitHub token"
    - name: github-token-key
      type: string
      default: "github-token"
      description: "Key of the secret containing the GitHub token"
  volumes:
    - name: github-secret-volume
      secret:
        secretName: $(params.github-token-secret)
    - name: registry-auth
      secret:
        secretName: $(params.registry-auth-secret)
        optional: true
    - name: registry-auth-prod
      secret:
        secretName: $(params.registry-auth-secret-prod)
        optional: true
    - name: registry-auth-mirror
      secret:
        secretName: $(params.registry-auth-secret-mirror)
        optional: true
    - name: shared-bin-dir
      emptyDir: { }
  results:
    - name: pr-url
      description: The pull request updating the catalog, empty when there was nothing to update
      value: $(steps.render-catalog.results.pr-url)
    - name: pr-branch
      description: Branch the pull request is opened from, reported even when no pull request was needed
      value: $(steps.render-catalog.results.pr-branch)
    - name: changed
      description: 1 when the catalog changed, 0 when it was already up to date
      value: $(steps.render-catalog.results.changed)
  stepTemplate:
    image: quay.io/openshift-pipeline/ci
    workingDir: /workspace
    env:
      - name: VERSION
        value: $(params.VERSION)
      - name: REPO
        value: $(params.REPO)
      - name: OLM_ENVIRONMENT
        value: $(params.OLM_ENVIRONMENT)
      - name: OCP_VERSIONS
        value: $(params.OCP_VERSIONS)
      - name: MIRROR_REGISTRY
        value: $(params.MIRROR_REGISTRY)
      - name: OPM_VERSION
        value: $(params.OPM_VERSION)
      - name: PR_BRANCH
        value: $(params.PR_BRANCH)
      - name: LABELS
        value: $(params.LABELS)
      - name: DRY_RUN
        value: $(params.DRY_RUN)
      - name: REGISTRY_AUTH_DIR
        value: /etc/registry-auth
      - name: REGISTRY_AUTH_KEY
        value: $(params.registry-auth-key)
      - name: HOME
        value: /shared-bin
      - name: BIN_DIR
        value: /shared-bin
      - name: PATH
        value: "/shared-bin:/usr/local/bin:/usr/bin"
      - name: GH_TOKEN
        valueFrom:
          secretKeyRef:
            name: $(params.github-token-secret)
            key: $(params.github-token-key)
    volumeMounts:
      - name: shared-bin-dir
        mountPath: /shared-bin
      - name: github-secret-volume
        mountPath: /etc/github
        readOnly: true
      - name: registry-auth
        mountPath: /etc/registry-auth/stage
        readOnly: true
      - name: registry-auth-prod
        mountPath: /etc/registry-auth/prod
        readOnly: true
      - name: registry-auth-mirror
        mountPath: /etc/registry-auth/mirror
        readOnly: true

  steps:
    - name: install-dependencies
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        mkdir -p $BIN_DIR
        cd /tmp

        echo "# gh cli"
        GH_VERSION=$(curl -s "https://api.github.com/repos/cli/cli/releases/latest" | grep '"tag_name":' | sed -E 's/.*"v([^"]+)".*/\1/')
        GH_TAR_BALL=gh_${GH_VERSION}_linux_amd64
        curl -sLO "https://github.com/cli/cli/releases/download/v${GH_VERSION}/$GH_TAR_BALL.tar.gz"
        tar -xf $GH_TAR_BALL.tar.gz
        cp "gh_${GH_VERSION}_linux_amd64/bin/gh" $BIN_DIR
        rm -rf $GH_TAR_BALL*

        # The workflow pins opm, the image ships its own version and BIN_DIR
        # comes first on PATH, so the pinned one is the one that runs.
        echo "# opm $OPM_VERSION"
        curl -sSfLo "$BIN_DIR/opm" "https://github.com/operator-framework/operator-registry/releases/download/${OPM_VERSION}/linux-amd64-opm"
        chmod +x "$BIN_DIR/opm"
        echo "opm: $(opm version 2>&1 | head -1)"

    - name: render-catalog
      results:
        - name: pr-url
        - name: pr-branch
        - name: changed
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        # Determine the branch the release lives on
        if [[ "$VERSION" == "next" || "$VERSION" == "nightly" || "$VERSION" == "main" ]]; then
          BASE_BRANCH="$VERSION"
        else
          BASE_BRANCH="release-v$VERSION.x"
        fi

        if [[ -z "$PR_BRANCH" ]]; then
          # The branch of the render-olm-catalog workflow, on purpose
          PR_BRANCH="actions/update/operator-update-catalog-${BASE_BRANCH}"
        fi
        echo -n "$PR_BRANCH" > $(step.results.pr-branch.path)

        # The pipeline speaks devel/stage/prod, the scripts speak
        # devel/staging/production. Empty still means "whatever
        # olm/release-stage.txt holds", the behaviour of the workflow.
        case "$OLM_ENVIRONMENT" in
          "")              ;;
          devel)           OLM_ENVIRONMENT=devel ;;
          stage|staging)   OLM_ENVIRONMENT=staging ;;
          prod|production) OLM_ENVIRONMENT=production ;;
          *) echo "ERROR: OLM_ENVIRONMENT='$OLM_ENVIRONMENT' is not one of devel, stage, prod" >&2; exit 1 ;;
        esac

        # ==========================================
        # STEP 1: REGISTRY CREDENTIALS AND MIRRORS
        # ==========================================
        find_auth() {
          local dir=$1 key=$2 candidate
          [[ -d "$dir" ]] || return 0
          if [[ -n "$key" && -s "$dir/$key" ]]; then
            echo "$dir/$key"
            return
          fi
          for candidate in .dockerconfigjson config.json .dockercfg; do
            if [[ -s "$dir/$candidate" ]]; then
              echo "$dir/$candidate"
              return
            fi
          done
          find "$dir" -maxdepth 1 -type f -size +0 2>/dev/null | head -n1
        }

        export DOCKER_CONFIG="$HOME/.docker"
        export REGISTRY_AUTH_FILE="$DOCKER_CONFIG/config.json"
        mkdir -p "$DOCKER_CONFIG"

        # Merge every mounted secret, a missing one is only a warning so that
        # a run targeting one environment does not need the other's secret.
        echo '{"auths":{}}' > "$REGISTRY_AUTH_FILE"
        for dir in "$REGISTRY_AUTH_DIR"/*/; do
          [[ -d "$dir" ]] || continue
          AUTH_SRC=$(find_auth "$dir" "$REGISTRY_AUTH_KEY")
          if [[ -z "$AUTH_SRC" ]]; then
            echo "   ⚠️  no credentials mounted at $dir"
            continue
          fi
          jq -c --slurpfile add <(jq 'if has("auths") then . else {auths: .} end' "$AUTH_SRC") \
            '{auths: (.auths + ($add[0].auths // {}))}' "$REGISTRY_AUTH_FILE" > "$REGISTRY_AUTH_FILE.new"
          mv "$REGISTRY_AUTH_FILE.new" "$REGISTRY_AUTH_FILE"
        done
        echo "🔑 Registries available to the render: $(jq -r '.auths | keys | join(", ")' "$REGISTRY_AUTH_FILE")"
        if [[ "$(jq -r '.auths | length' "$REGISTRY_AUTH_FILE")" == "0" ]]; then
          echo "WARNING: no registry credentials mounted at all"
        fi

        # The bundle is referenced by its released pullspec but is not on the
        # released registry yet, so resolve those to the Konflux build holding
        # the same digest, exactly as the workflow does.
        # The workflow drops this in $HOME/.config/containers/registries.conf.d
        # of a root container. Here it goes in the user registries.conf itself:
        # containers/image only picks up the user drop-in directory when that
        # file exists, and defining the same location in both files is an error.
        mkdir -p "$HOME/.config/containers"
        export CONTAINERS_REGISTRIES_CONF="$HOME/.config/containers/registries.conf"
        cat > "$CONTAINERS_REGISTRIES_CONF" <<EOF
        [[registry]]
        location = "registry.redhat.io/openshift-pipelines"

        [[registry.mirror]]
        location = "$MIRROR_REGISTRY"

        [[registry]]
        location = "registry.stage.redhat.io/openshift-pipelines"

        [[registry.mirror]]
        location = "$MIRROR_REGISTRY"
        EOF
        echo "🪞 Mirrors ($CONTAINERS_REGISTRIES_CONF):"
        cat "$CONTAINERS_REGISTRIES_CONF"

        # ==========================================
        # STEP 2: RENDER THE CATALOG
        # ==========================================
        gh auth setup-git
        REPO_DIR=$(mktemp -d)
        gh repo clone "$REPO" "$REPO_DIR" -- -b "$BASE_BRANCH" --depth 1 --quiet
        cd "$REPO_DIR"

        echo "📌 bundle.yaml at $(git rev-parse --short HEAD) on $BASE_BRANCH"
        if [[ -n "$OLM_ENVIRONMENT" ]]; then
          echo "🎯 Targeting $OLM_ENVIRONMENT, olm/release-stage.txt was $(cat olm/release-stage.txt 2>/dev/null || echo unset)"
        else
          echo "🎯 Targeting the registry of olm/release-stage.txt: $(cat olm/release-stage.txt 2>/dev/null || echo unset)"
        fi

        ./hack/update-olm-bundle.sh $OLM_ENVIRONMENT

        # Rendering pulls every bundle of the catalog, a registry hiccup should
        # not fail the release. The workflow retries it three times as well.
        for attempt in 1 2 3; do
          if ./hack/render-catalog.sh $OCP_VERSIONS; then
            break
          fi
          if [[ "$attempt" == "3" ]]; then
            echo "ERROR: rendering the catalog failed after $attempt attempts" >&2
            exit 1
          fi
          echo "Render failed, retrying in 60s (attempt $attempt)..."
          sleep 60
        done

        # The same paths the workflow commits
        git add .konflux/olm-catalog/index/ olm/

        if [[ -z $(git status --porcelain --untracked-files=no) ]]; then
          echo "🎉 The catalog is already in sync with bundle.yaml, nothing to do"
          echo -n "0" > $(step.results.changed.path)
          echo -n "" > $(step.results.pr-url.path)
          exit 0
        fi
        echo -n "1" > $(step.results.changed.path)

        echo "📄 Changed files:"
        git --no-pager diff --cached --stat

        if [[ "$DRY_RUN" == "true" ]]; then
          echo "DRY_RUN is set, not pushing anything"
          echo -n "" > $(step.results.pr-url.path)
          exit 0
        fi

        # ==========================================
        # STEP 3: PUSH AND OPEN A SINGLE PR
        # ==========================================
        git config user.name "One Click Release Bot"
        git config user.email "one-click-release-bot@redhat.com"
        git checkout -b "$PR_BRANCH"
        git commit -m "[bot:$BASE_BRANCH] Update catalog" --quiet
        git push -f origin "$PR_BRANCH" --quiet

        PR_URL=$(gh pr list --repo "$REPO" --base "$BASE_BRANCH" --head "$PR_BRANCH" --state open --json url --jq '.[0].url // empty')
        if [[ -z "$PR_URL" ]]; then
          IFS=',' read -ra LABEL_ARRAY <<< "$LABELS"
          LABEL_ARGS=()
          for label in "${LABEL_ARRAY[@]}"; do
            label=$(xargs <<< "$label")
            [[ -n "$label" ]] || continue
            if [[ -z "$(gh label list --repo "$REPO" --search "$label" --json name -q ".[] | select(.name == \"$label\") | .name")" ]]; then
              gh label create "$label" --repo "$REPO" --color "0E8A16" --description "Auto-created by pipeline" || true
            fi
            LABEL_ARGS+=(--label "$label")
          done

          cat > /tmp/pr-body.md <<EOF
        Renders the OLM catalog from \`bundle.yaml\`.

        Generated by the one-click-release pipeline, the same update the
        render-olm-catalog workflow does, run in sequence so that the index
        images are not built before the catalog is rendered.
        EOF

          PR_URL=$(gh pr create --repo "$REPO" \
            --base "$BASE_BRANCH" --head "$PR_BRANCH" \
            "${LABEL_ARGS[@]}" \
            --title "[bot:$BASE_BRANCH] Update catalog" \
            --body-file /tmp/pr-body.md)
          echo "   ✅ Created $PR_URL"
        else
          gh pr edit "$PR_URL" --add-label "lgtm" --add-label "approved" || true
          echo "   ✅ Updated existing $PR_URL"
        fi

        echo -n "$PR_URL" > $(step.results.pr-url.path)
