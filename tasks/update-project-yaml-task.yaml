apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: update-project-yaml-task
spec:
  description: >-
    Updates the image digests of an images file in the operator repository with
    the ones of the snapshot produced by the wait-for-snapshot task and opens a
    single pull request against the matching release branch
    (release-v<VERSION>.x). It is used for project.yaml with the core snapshot
    and for bundle.yaml with the bundle snapshot, both hold a list of
    name/value image references.

    Digests are matched on the image repository, so only the entries already
    present in project.yaml are touched and no other file is modified. The pull
    request branch name is derived from the version, so re-running the task
    updates the existing pull request instead of opening a new one.
  params:
    - name: VERSION
      type: string
      default: "1.22"
      description: "Minor version being released, e.g. 1.22. Decides the release branch"
    - name: SNAPSHOT
      type: string
      description: "Snapshot to read the digests from, as returned by the wait-for-snapshot task"
    - name: REPO
      type: string
      default: "openshift-pipelines/operator"
      description: "Repository holding the project.yaml"
    - name: PROJECT_FILE
      type: string
      default: "project.yaml"
      description: "Path of the images file inside REPO, project.yaml or bundle.yaml"
    - name: PR_BRANCH
      type: string
      default: ""
      description: "Branch the pull request is opened from, defaults to one-click-release/<VERSION>/update-project-yaml"
    - name: LABELS
      type: string
      default: "automated,one-click-release"
      description: "Comma separated labels added to the pull request"
    - name: DRY_RUN
      type: string
      default: "false"
      description: "When true the updated project.yaml is only printed, nothing is pushed"
    - name: github-token-secret
      type: string
      default: "github-release"
      description: "Name of the secret containing the GitHub token"
    - name: github-token-key
      type: string
      default: "github-token"
      description: "Key of the secret containing the GitHub token"
  volumes:
    - name: github-secret-volume
      secret:
        secretName: $(params.github-token-secret)
    - name: shared-bin-dir
      emptyDir: { }
  results:
    - name: updated-images
      description: Number of image digests updated in the project file
      value: $(steps.update-project-yaml.results.updated-images)
    - name: pr-url
      description: The pull request updating the project file, empty when there was nothing to update
      value: $(steps.update-project-yaml.results.pr-url)
    - name: pr-branch
      description: Branch the pull request is opened from, it is reported even when no pull request was needed
      value: $(steps.update-project-yaml.results.pr-branch)
  stepTemplate:
    image: quay.io/openshift-pipeline/ci
    workingDir: /workspace
    env:
      - name: VERSION
        value: $(params.VERSION)
      - name: SNAPSHOT
        value: $(params.SNAPSHOT)
      - name: REPO
        value: $(params.REPO)
      - name: PROJECT_FILE
        value: $(params.PROJECT_FILE)
      - name: PR_BRANCH
        value: $(params.PR_BRANCH)
      - name: LABELS
        value: $(params.LABELS)
      - name: DRY_RUN
        value: $(params.DRY_RUN)
      - name: HOME
        value: /shared-bin
      - name: BIN_DIR
        value: /shared-bin
      - name: PATH
        value: "/shared-bin:/usr/local/bin:/usr/bin"
      - name: GH_TOKEN
        valueFrom:
          secretKeyRef:
            name: $(params.github-token-secret)
            key: $(params.github-token-key)
    volumeMounts:
      - name: shared-bin-dir
        mountPath: /shared-bin
      - name: github-secret-volume
        mountPath: /etc/github
        readOnly: true

  steps:
    - name: install-dependencies
      script: |
        echo "# 1. Create a local bin directory if it doesn't already exist"
        mkdir -p $BIN_DIR
        cd  /tmp

        echo "# 2. Fetch the latest version number from GitHub"
        VERSION=$(curl -s "https://api.github.com/repos/cli/cli/releases/latest" | grep '"tag_name":' | sed -E 's/.*"v([^"]+)".*/\1/')


        GH_TAR_BALL=gh_${VERSION}_linux_amd64
        echo "Using gh cli $$GH_TAR_BALL"

        echo "# 3. Download the tarball"
        curl -sLO "https://github.com/cli/cli/releases/download/v${VERSION}/$GH_TAR_BALL.tar.gz"

        echo "# 4. Extract the tarball"
        tar -xf $GH_TAR_BALL.tar.gz

        # 5. Move the 'gh' binary to your local bin folder
        cp "gh_${VERSION}_linux_amd64/bin/gh" $BIN_DIR

        # 6. Clean up the downloaded files
        rm -rf $GH_TAR_BALL*

    - name: update-project-yaml
      results:
        - name: updated-images
        - name: pr-url
        - name: pr-branch
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        # Determine the branch the release lives on
        if [[ "$VERSION" == "next" || "$VERSION" == "nightly" || "$VERSION" == "main" ]]; then
          BASE_BRANCH="$VERSION"
        else
          BASE_BRANCH="release-v$VERSION.x"
        fi

        if [[ -z "$PR_BRANCH" ]]; then
          # One branch per file, project.yaml and bundle.yaml must not collide:
          # project.yaml -> update-project-yaml, bundle.yaml -> update-bundle-yaml
          PR_BRANCH="one-click-release/$VERSION/update-$(basename "$PROJECT_FILE" | tr '.' '-')"
        fi
        # Reported upfront, the step exits early when there is nothing to update
        echo -n "$PR_BRANCH" > $(step.results.pr-branch.path)

        # ==========================================
        # STEP 1: READ THE DIGESTS OF THE SNAPSHOT
        # ==========================================
        if [[ -z "$SNAPSHOT" ]]; then
          echo "ERROR: SNAPSHOT is empty, it is produced by the wait-for-snapshot task" >&2
          exit 1
        fi
        echo "📥 Reading the component digests of snapshot: $SNAPSHOT"

        # <image repository><TAB><digest> for every component of the snapshot
        DIGESTS=/tmp/digests.tsv
        oc get snapshot "$SNAPSHOT" -o json \
          | jq -r '.spec.components[]
              | select(.containerImage | contains("@sha256:"))
              | [(.containerImage | split("@")[0]), (.containerImage | split("@")[1])]
              | @tsv' \
          | sort -u > "$DIGESTS"

        if [[ ! -s "$DIGESTS" ]]; then
          echo "ERROR: snapshot $SNAPSHOT has no digest pinned component image" >&2
          exit 1
        fi
        echo "   Components in the snapshot: $(wc -l < "$DIGESTS")"

        # ==========================================
        # STEP 2: UPDATE THE PROJECT FILE
        # ==========================================
        gh auth setup-git
        REPO_DIR=$(mktemp -d)
        gh repo clone "$REPO" "$REPO_DIR" -- -b "$BASE_BRANCH" --depth 1 --quiet
        cd "$REPO_DIR"

        if [[ ! -f "$PROJECT_FILE" ]]; then
          echo "ERROR: $PROJECT_FILE not found in $REPO on branch $BASE_BRANCH" >&2
          exit 1
        fi

        # Replace the digest of every image whose repository is part of the
        # snapshot. Matching on the repository keeps the comments, the ordering
        # and any image not built by this application untouched.
        SED_SCRIPT=/tmp/digests.sed
        : > "$SED_SCRIPT"
        UPDATED=0
        while IFS=$'\t' read -r repository digest; do
          # Escape the regex metacharacters of the repository before using it as a pattern
          escaped=$(sed -e 's/[.[\*^$\\]/\\&/g' <<< "$repository")
          current=$(grep -o "${escaped}@sha256:[a-f0-9]\{1,\}" "$PROJECT_FILE" | sort -u || true)
          if [[ -z "$current" ]]; then
            echo "   ⏭️  $repository is not referenced in $PROJECT_FILE"
            continue
          fi
          if [[ "$current" == "${repository}@${digest}" ]]; then
            echo "   ✅ $repository is already up to date"
            continue
          fi
          echo "   🔄 $repository -> $digest"
          printf 's|%s@sha256:[a-f0-9]\\{1,\\}|%s@%s|g\n' "$escaped" "$repository" "$digest" >> "$SED_SCRIPT"
          UPDATED=$((UPDATED + 1))
        done < "$DIGESTS"

        echo -n "$UPDATED" > $(step.results.updated-images.path)

        if [[ "$UPDATED" -eq 0 ]]; then
          echo "🎉 $PROJECT_FILE is already in sync with snapshot $SNAPSHOT, nothing to do"
          echo -n "" > $(step.results.pr-url.path)
          exit 0
        fi

        sed -i -f "$SED_SCRIPT" "$PROJECT_FILE"

        # Only the project file may change, anything else is a bug
        CHANGED=$(git status --porcelain -- . | awk '{print $2}')
        if [[ "$CHANGED" != "$PROJECT_FILE" ]]; then
          echo "ERROR: expected only $PROJECT_FILE to change, got: $CHANGED" >&2
          exit 1
        fi

        echo "📄 Diff:"
        git --no-pager diff -- "$PROJECT_FILE"

        if [[ "$DRY_RUN" == "true" ]]; then
          echo "DRY_RUN is set, not pushing anything"
          echo -n "" > $(step.results.pr-url.path)
          exit 0
        fi

        # ==========================================
        # STEP 3: PUSH AND OPEN A SINGLE PR
        # ==========================================
        git config user.name "One Click Release Bot"
        git config user.email "one-click-release-bot@redhat.com"
        git checkout -b "$PR_BRANCH"
        git commit -m "[bot:$VERSION] Update $PROJECT_FILE with digests from $SNAPSHOT" -- "$PROJECT_FILE"
        git push -f origin "$PR_BRANCH" --quiet

        # The branch name only depends on the version, so an existing pull
        # request is updated by the push above instead of a new one being opened.
        PR_URL=$(gh pr list --repo "$REPO" --base "$BASE_BRANCH" --head "$PR_BRANCH" --state open --json url --jq '.[0].url // empty')
        if [[ -z "$PR_URL" ]]; then
          IFS=',' read -ra LABEL_ARRAY <<< "$LABELS"
          LABEL_ARGS=()
          for label in "${LABEL_ARRAY[@]}"; do
            label=$(xargs <<< "$label")
            [[ -n "$label" ]] || continue
            if [[ -z "$(gh label list --repo "$REPO" --search "$label" --json name -q ".[] | select(.name == \"$label\") | .name")" ]]; then
              gh label create "$label" --repo "$REPO" --color "0E8A16" --description "Auto-created by pipeline" || true
            fi
            LABEL_ARGS+=(--label "$label")
          done

          cat > /tmp/pr-body.md <<EOF
        Updates $UPDATED image digest(s) in \`$PROJECT_FILE\` from the core snapshot \`$SNAPSHOT\`.

        Generated by the one-click-release pipeline.
        EOF

          PR_URL=$(gh pr create --repo "$REPO" \
            --base "$BASE_BRANCH" --head "$PR_BRANCH" \
            "${LABEL_ARGS[@]}" \
            --title "[bot:$VERSION] Update $PROJECT_FILE with the digests of $SNAPSHOT" \
            --body-file /tmp/pr-body.md)
          echo "   ✅ Created $PR_URL"
        else
          echo "   ✅ Updated existing $PR_URL"
        fi

        echo -n "$PR_URL" > $(step.results.pr-url.path)
