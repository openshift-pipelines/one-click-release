apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: release-config-task
spec:
  params:
    - name: VERSION
      type: string
      default: ""
    - name: NEW_PATCH
      default: "false"
    - name: DRY_RUN
      default: "false"
    - name: REPO_URL
      default: https://github.com/openshift-pipelines/hack
    - name: REVISION
      default: main
    - name: github-token-secret
      type: string
      default: "my-github-secret"
      description: "Name of the secret containing the GitHub token"
    - name: github-token-key
      type: string
      default: "token"
  volumes:
    - name: github-secret-volume
      secret:
        secretName: $(params.github-token-secret)
    - name: shared-bin-dir
      emptyDir: { }
  results:
    - name: VERSION-plan
      description: The VERSION plan name
    - name: snapshot
      description: The snapshot name
    - name: VERSION
      description: The created VERSION name
  stepTemplate:
    workingDir: $(workspaces.source.path)/
    image: quay.io/openshift-pipeline/ci:latest
    volumeMounts:
      - name: shared-bin-dir
        mountPath: /shared-bin
      - name: github-secret-volume
        mountPath: /etc/github
        readOnly: true

    env:
      - name: HOME
        value: /shared-bin
      - name: VERSION
        value: $(params.VERSION)
      - name: BIN_DIR
        value: /shared-bin
      - name: PATH
        value: "/shared-bin:/usr/local/bin:/usr/bin"
      - name: GH_TOKEN
        valueFrom:
          secretKeyRef:
            name: $(params.github-token-secret)
            key: $(params.github-token-key)

  steps:
    - name: install-dependencies
      script: |
        echo "# 1. Create a local bin directory if it doesn't already exist"
        mkdir -p $BIN_DIR
        cd  /tmp

        echo "# 2. Fetch the latest version number from GitHub"
        VERSION=$(curl -s "https://api.github.com/repos/cli/cli/releases/latest" | grep '"tag_name":' | sed -E 's/.*"v([^"]+)".*/\1/')


        GH_TAR_BALL=gh_${VERSION}_linux_amd64
        echo "Using gh cli $$GH_TAR_BALL"

        echo "# 3. Download the tarball"
        curl -sLO "https://github.com/cli/cli/releases/download/v${VERSION}/$GH_TAR_BALL.tar.gz"

        echo "# 4. Extract the tarball"
        tar -xf $GH_TAR_BALL.tar.gz

        # 5. Move the 'gh' binary to your local bin folder
        cp "gh_${VERSION}_linux_amd64/bin/gh" $BIN_DIR

        # 6. Clean up the downloaded files
        rm -rf $GH_TAR_BALL*

    - name: clone-repo
      script: |
        set -x
        git clone -b $(params.REVISION) $(params.REPO_URL) repo

    - name: create-new-patch
      when:
        - input: $(params.NEW_PATCH)
          operator: in
          values:
            - "true"
      script: |
        set -x
        cd repo
        ./hack/VERSION-manager.sh \
        --action "new-patch" \
        --version "$VERSION" 


    - name: generate-konflux-config
      when:
        - input: $(params.NEW_PATCH)
          operator: in
          values:
            - "true"
      description: |
        Generate Konflux Config from Hack Repo
      env:
        - name: GOCACHE
          value: $(workspaces.source.path)/.cache
      script: |
        gh auth setup-git
        cd repo
        go run ./cmd/konflux --version=$VERSION --dry-run=$(params.DRY_RUN) --generate-tekton=false

    - name: commit-new-changes
      when:
        - input: $(params.DRY_RUN)
          operator: in
          values:
            - "false"
        - input: $(params.NEW_PATCH)
          operator: in
          values:
            - "true"

      script: |
        # 1. Set the Git identity for this workspace
        cd repo
        gh auth setup-git
        git config user.email "pipeline-bot@redhat.com"
        git config user.name "Tekton Pipeline Bot"
        BASE_BRANCH=$(git branch --show-current)
        SOURCE_BRANCH=relase/$VERSION/hack-update-konflux-config
        git checkout -b ${SOURCE_BRANCH}
        git add -f .konflux config

        if [[ -z $(git status --porcelain --untracked-files=no) ]]; then
          echo "No change, exiting"
          exit 0
        fi

        git commit -F- <<EOF
          [bot:$VERSION] Update Generated Konflux Config
        EOF

        git push -f origin ${SOURCE_BRANCH}
        set -x
        if [ "$(gh pr list --base ${BASE_BRANCH} --head ${SOURCE_BRANCH} --json url --jq 'length')" = "0" ]; then
          echo "creating PR..."
          gh pr create -B ${BASE_BRANCH} -H ${SOURCE_BRANCH} --label=automated --label=hack   --fill
        else 
          echo "PR already exists: $(gh pr list --base ${BASE_BRANCH} --head ${SOURCE_BRANCH} --json url --jq .[].url)"
        fi
    - name: apply-konflux-configuration
      script: |
        kubectl apply -Rf  ./repo/.konflux/openshift-pipelines/${VERSION/./-}
    - name: generate-tekton-config
      when:
        - input: $(params.NEW_PATCH)
          operator: in
          values:
            - "true"
      description: |
        Generate Konflux Config from Hack Repo
      env:
        - name: GOCACHE
          value: $(workspaces.source.path)/.cache
      script: |
        gh auth setup-git
        cd repo
        go run ./cmd/konflux --version=$VERSION --dry-run=$(params.DRY_RUN) --generate-tekton=true

  workspaces:
    - name: source

