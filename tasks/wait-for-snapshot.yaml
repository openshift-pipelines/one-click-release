apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: wait-for-snapshot
spec:
  params:
    - name: VERSION
      default: "1.15"
      description: "The source branch of the PR to trigger the initial workflow on"
    - name: APP
      description: "The source branch of the PR to trigger the initial workflow on"
    - name: github-token-secret
      type: string
      default: "github-release"
      description: "Name of the secret containing the GitHub token"
    - name: github-token-key
      type: string
      default: "github-token"
      description: "Name of the secret containing the GitHub token"
  volumes:
    - name: github-secret-volume
      secret:
        secretName: $(params.github-token-secret)
    - name: shared-bin-dir
      emptyDir: { }
  results:
    - name: snapshot
      description: The latest snapshot of the application once everything is in sync
      value: $(steps.wait-for-snapshot.results.snapshot)
  stepTemplate:
    image: quay.io/openshift-pipeline/ci
    workingDir: /workspace
    env:
      - name: VERSION
        value: $(params.VERSION)
      - name: APP
        value: $(params.APP)
      - name: HOME
        value: /shared-bin
      - name: BIN_DIR
        value: /shared-bin
      - name: PATH
        value: "/shared-bin:/usr/local/bin:/usr/bin"
      - name: GH_TOKEN
        valueFrom:
          secretKeyRef:
            name: $(params.github-token-secret)
            key: $(params.github-token-key)
    volumeMounts:
      - name: shared-bin-dir
        mountPath: /shared-bin
      - name: github-secret-volume
        mountPath: /etc/github
        readOnly: true

  steps:
    - name: install-dependencies
      script: |
        echo "# 1. Create a local bin directory if it doesn't already exist"
        mkdir -p $BIN_DIR
        cd  /tmp

        echo "# 2. Fetch the latest version number from GitHub"
        VERSION=$(curl -s "https://api.github.com/repos/cli/cli/releases/latest" | grep '"tag_name":' | sed -E 's/.*"v([^"]+)".*/\1/')


        GH_TAR_BALL=gh_${VERSION}_linux_amd64
        echo "Using gh cli $$GH_TAR_BALL"

        echo "# 3. Download the tarball"
        curl -sLO "https://github.com/cli/cli/releases/download/v${VERSION}/$GH_TAR_BALL.tar.gz"

        echo "# 4. Extract the tarball"
        tar -xf $GH_TAR_BALL.tar.gz

        # 5. Move the 'gh' binary to your local bin folder
        cp "gh_${VERSION}_linux_amd64/bin/gh" $BIN_DIR

        # 6. Clean up the downloaded files
        rm -rf $GH_TAR_BALL*

    - name: wait-for-snapshot
      results:
        - name: snapshot
      script: |
        #!/usr/bin/env bash
  
        # Determine the BASE_BRANCH based on the VERSION parameter
        if [[ "$VERSION" == "next" || "$VERSION" == "nightly" ]]; then
          TARGET_BRANCH="$VERSION"
        else
          TARGET_BRANCH="release-v$VERSION.x"
        fi
        
        # ==========================================
        # CORE FUNCTION: Rebuild Repo
        # ==========================================
        
        function rebuild_repo() {
          # Use 'local' to prevent variables from leaking into the global scope
          local repo_path=$1
          local app=$2
          local tmp_dir
          local new_commit_sha
          local file=.konflux/patches/.placeholder
          if [[ $app == "index" ]]; then
              file=".konflux/olm-catalog/index/.placeholder"
          elif [[ $app == "bundle" ]]; then 
              file=".konflux/olm-catalog/bundle/.placeholder"
          fi;
          
          tmp_dir=$(mktemp -d)
          gh repo clone "$repo_path" "$tmp_dir" -- -b "$TARGET_BRANCH" --depth 1 --quiet
          
          cd "$tmp_dir" || return 1 # Use return instead of continue in functions
          
          mkdir -p .konflux/patches/
          echo "Forced multi-component rebuild at $(date)" > .konflux/patches/.placeholder
          
          gh auth setup-git
          git config user.name "One Click Release Bot"
          git config user.email "one-click-release-bot@redhat.com"
          git submodule update --remote --merge --recursive
          git add .
          git commit -m "One Click Release:  build all konflux components" --quiet
          git push origin "$TARGET_BRANCH" --quiet
          new_commit_sha=$(git rev-parse HEAD)
          
          cd - > /dev/null || true
          rm -rf "$tmp_dir"
  
          # Print the log message to STDERR (>&2) so it appears on the screen
          # but doesn't get captured by the variable assignment later.
          echo "   ✅ Pushed new commit! New SHA: $repo_path/$new_commit_sha" >&2
          
          # Print ONLY the raw SHA to STDOUT. This is your "return" value.
            echo "$new_commit_sha"
        }
  
        # ==========================================
        # CORE FUNCTION: Verify and Trigger
        # ==========================================
  
        verify_snapshot() {
          local json_file="$1"
          
          # Reset arrays for each run
          mismatched_repos=()
          mismatched_data=()
          
          echo "========================================"
          echo "🔍 STEP 1: VERIFYING GIT SHAS $json_file"
          echo "========================================"
          
          while read -r item; do
          component=$(echo "$item" | jq -r '.name')
          repo_url=$(echo "$item" | jq -r '.source.git.url')
          json_revision=$(echo "$item" | jq -r '.source.git.revision')
          repo_name=$(basename "$repo_url" .git)
          
          latest_sha=$(git ls-remote "$repo_url" "refs/heads/$TARGET_BRANCH" | awk '{print $1}')
          
          if [ -z "$latest_sha" ]; then
            mismatched_repos+=("⚠️  $repo_name: Failed to fetch remote SHA")
            continue
          fi
          if [ "$json_revision" != "$latest_sha" ]; then
            if [[ "$repo_name" == "operator" && $APP == "core" ]]; then
              echo "Skipping $repo_name for $APP"
              continue
            fi
            mismatched_repos+=("❌ $component (JSON: $json_revision -> Remote: $latest_sha)")
            repo_path=$(echo "$repo_url" | sed -E 's|https?://[^/]+/||; s|\.git$||')
            # 2. DEDUPLICATION LOGIC: Only add to the trigger list if not already present
            is_duplicate=false
            for existing_repo in "${mismatched_data[@]}"; do
            if [ "$existing_repo" = "$repo_path|$latest_sha" ]; then
            is_duplicate=true
            break
          fi
          done
          # If it's a new repo, add it to our action list
          if [ "$is_duplicate" = false ]; then
          mismatched_data+=("$repo_path|$latest_sha")
          fi
          fi
          done < <(jq -c '.[]' "$json_file")
          
          # If no mismatches, we are completely done!
          if [ ${#mismatched_data[@]} -eq 0 ]; then
          echo "🎉 All repositories in the snapshot are fully up to date!"
          return 0 # Exit function with success
          fi
          
          # ==========================================
          # STEP 2: PRINT REPORT
          # ==========================================
          echo ""
          echo "📊 MISMATCH REPORT"
          for line in "${mismatched_repos[@]}"; do
          echo "$line"
          done
          
          # ==========================================
          # STEP 3: TRIGGER RETESTS
          # ==========================================
          echo ""
          echo "⚙️  STEP 3: CHECKING PIPELINES & TRIGGERING RETESTS"
          
          for data in "${mismatched_data[@]}"; do
          IFS='|' read -r repo_path commit_sha <<< "$data"
          repo_name=$(basename "$repo_path")
          
          active_checks=$(gh api "repos/$repo_path/commits/$commit_sha/check-runs" -q \
          '[.check_runs[]
          | select((.name | test("push")) or (.app.slug == "github-actions"))
          | select(.status == "queued" or .status == "in_progress")] | length' 2>/dev/null || echo "0")
        
          active_statuses=$(gh api "repos/$repo_path/commits/$commit_sha/status" -q '[.statuses[] | select(.state == "pending")] | length' 2>/dev/null || echo "0")
          total_active=$((active_checks + active_statuses))
          
          if [[ "$total_active" -eq 0 && $APP == "core" ]]; then
            commit_sha=$(rebuild_repo $repo_path $APP)
            mismatched_data+=("$repo_path|$commit_sha")
          else
            echo "   🔄 $repo_name: $total_active checks are already running. (Rebuild Skipped)"
          fi
          done
          
          # ==========================================
          # STEP 4: WAIT FOR PIPELINES
          # ==========================================
          echo ""
        echo "⏳ STEP 4: WAITING FOR PIPELINES TO FINISH on $commit_sha"
          sleep 30 # Queue buffer
          
          while true; do
          pending_repos=0
          pending_checks=0
          for data in "${mismatched_data[@]}"; do
          IFS='|' read -r repo_path commit_sha <<< "$data"
          active_checks=$(gh api "repos/$repo_path/commits/$commit_sha/check-runs" -q \
          '[.check_runs[]
          | select((.name | test("push")) or (.app.slug == "github-actions"))
          | select(.status == "queued" or .status == "in_progress")] | length' 2>/dev/null || echo "0")
        
          active_statuses=$(gh api "repos/$repo_path/commits/$commit_sha/status" -q '[.statuses[] | select(.state == "pending")] | length' 2>/dev/null || echo "0")
          total_active=$((active_checks + active_statuses))
          
          if [ "$total_active" -gt 0 ]; then
          pending_repos=$((pending_repos + 1))
          pending_checks=$((pending_checks + total_active))
          fi
          done
          
          if [ "$pending_repos" -eq 0 ]; then
          echo "   ✅ All triggered pipelines have finished!"
          break
          fi
          echo "   🔄 On $pending_repos repository(s) $pending_checks pipeline(s) still active. Waiting 30 seconds..."
          sleep 30
          done
          
          # Return 1 to indicate we had mismatches and need to repeat the loop
          return 1
        }
  
          function verify_application() {
          APPLICATION=$1
        echo "📥 Fetching the latest snapshot for application: $APPLICATION..."
          LATEST_SNAPSHOT=$(
          oc get snapshots \
          -l "pac.test.appstudio.openshift.io/event-type=push,appstudio.openshift.io/application=${APPLICATION}" \
          --sort-by=.metadata.creationTimestamp \
          -o jsonpath='{.items[*].metadata.name}' | awk '{print $NF}'
          )
        
          # Ensure we actually found a snapshot before continuing
          if [ -z "$LATEST_SNAPSHOT" ]; then
        echo "⚠️  Error: Could not find any snapshots for application '${APPLICATION}'."
          return 1
          fi
  
        echo "   LATEST_SNAPSHOT: $LATEST_SNAPSHOT"
        
        # 2. Extract the Git components into the JSON file
          oc get snapshot "$LATEST_SNAPSHOT" -o jsonpath="{.spec.components}" > "$JSON_FILE"
        
          # 3. Quick safety check to ensure the file isn't empty
          if [ ! -s "$JSON_FILE" ]; then
        echo "⚠️  Error: Failed to extract components (JSON file is empty)."
          return 1
          fi
        
          # 4. Run the verification function on the newly generated JSON
          if verify_snapshot "$JSON_FILE"; then
          # If it returns 0 (success), break the loop entirely!
          echo "✅ Verification complete. Everything is in sync. Exiting successfully."
          return 0
          fi
          return 1
        }
  
  
        # ==========================================
        # MAIN EXECUTION LOOP
        # ==========================================
          ATTEMPT=1
          MAX_ATTEMPTS=3 # Safety limit to prevent infinite loops
          
          # Define your file and OpenShift application name
          JSON_FILE="components.json"
          APPS=$(oc get application -o json | jq  -r --arg APP $APP  --arg VERSION ${VERSION//./-}  '
          .items[]
          | select(.metadata.name  | contains($APP) and contains($VERSION))
          |.metadata.name
          ')
          
          while IFS= read -r APPLICATION ;do
          #  while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
          echo ""
          echo "=================================================="
          echo "🚀 STARTING VERIFICATION LOOP (Attempt $ATTEMPT of $MAX_ATTEMPTS)"
          echo "=================================================="
          # 'read' blanks APPLICATION on the EOF iteration, keep the name for the result below
          VERIFIED_APPLICATION="$APPLICATION"
          verify_application "$APPLICATION"

          #    ATTEMPT=$((ATTEMPT + 1))
          #done
          # "$APPS" stays quoted, the applications are one per line
          done <<< "$APPS"

          # Publish the snapshot everything is in sync with, it is the one the
          # release and the project.yaml update are based on.
          if [ -z "$VERIFIED_APPLICATION" ]; then
          echo "❌ No application matching '$APP' and '${VERSION//./-}' was verified, cannot resolve a snapshot."
          exit 1
          fi

          FINAL_SNAPSHOT=$(
          oc get snapshots \
          -l "pac.test.appstudio.openshift.io/event-type=push,appstudio.openshift.io/application=${VERIFIED_APPLICATION}" \
          --sort-by=.metadata.creationTimestamp \
          -o jsonpath='{.items[*].metadata.name}' | awk '{print $NF}'
          )
          echo "📦 Latest snapshot of $VERIFIED_APPLICATION: $FINAL_SNAPSHOT"
          echo -n "$FINAL_SNAPSHOT" > $(step.results.snapshot.path)

          if [ -z "$FINAL_SNAPSHOT" ]; then
          echo "❌ No push snapshot found for $VERIFIED_APPLICATION."
          exit 1
          fi


          if [ $ATTEMPT -gt $MAX_ATTEMPTS ]; then
          echo "❌ Reached maximum attempts ($MAX_ATTEMPTS). The snapshot is still not syncing."
          exit 1
          fi

