apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: osp-github-pr-processor
spec:
  params:
    - name: GITHUB_ORG
      default: "openshift-pipelines"
    - name: SEARCH_LABEL
      description: "Comma separated labels to search for on open PRs, a PR matching any of them is processed"
      default: "hack,upstream,mintmaker,one-click-release,automated"
    - name: EXCLUDE_LABEL
      description: "Comma separated labels to skip, a PR carrying any of them is never processed"
      default: ""
    - name: HEAD_BRANCH
      description: "Only process the PRs opened from this branch, used to target a single generated PR"
      default: ""
    - name: ADDITIONAL_LABELS
      description: "Comma-separated list of labels to add before merging"
      default: [ "lgtm", "approved", "osp/pr-processor" ]
    - name: VERSION
      default: "1.15"
      description: "The source branch of the PR to trigger the initial workflow on"
    - name: MERGE_METHOD
      description: "Method to merge the PR (merge, squash, or rebase)"
      type: string
      default: "rebase"
    - name: github-token-secret
      type: string
      default: "github-release"
      description: "Name of the secret containing the GitHub token"
    - name: github-token-key
      type: string
      default: "github-token"
      description: "Name of the secret containing the GitHub token"
  volumes:
    - name: github-secret-volume
      secret:
        secretName: $(params.github-token-secret)
    - name: shared-bin-dir
      emptyDir: { }
  stepTemplate:
    image: quay.io/openshift-pipeline/ci
    workingDir: /workspace
    env:
      - name: VERSION
        value: $(params.VERSION)
      - name: SEARCH_LABEL
        value: $(params.SEARCH_LABEL)
      - name: EXCLUDE_LABEL
        value: $(params.EXCLUDE_LABEL)
      - name: HEAD_BRANCH
        value: $(params.HEAD_BRANCH)
      - name: BIN_DIR
        value: /shared-bin
      - name: PATH
        value: "/shared-bin:/usr/local/bin:/usr/bin"
      - name: GH_TOKEN
        valueFrom:
          secretKeyRef:
            name: $(params.github-token-secret)
            key: $(params.github-token-key)
    volumeMounts:
      - name: shared-bin-dir
        mountPath: /shared-bin
      - name: github-secret-volume
        mountPath: /etc/github
        readOnly: true

  steps:
    - name: install-dependencies
      script: |
        echo "# 1. Create a local bin directory if it doesn't already exist"
        mkdir -p $BIN_DIR
        cd  /tmp

        echo "# 2. Fetch the latest version number from GitHub"
        VERSION=$(curl -s "https://api.github.com/repos/cli/cli/releases/latest" | grep '"tag_name":' | sed -E 's/.*"v([^"]+)".*/\1/')


        GH_TAR_BALL=gh_${VERSION}_linux_amd64
        echo "Using gh cli $$GH_TAR_BALL"

        echo "# 3. Download the tarball"
        curl -sLO "https://github.com/cli/cli/releases/download/v${VERSION}/$GH_TAR_BALL.tar.gz"

        echo "# 4. Extract the tarball"
        tar -xf $GH_TAR_BALL.tar.gz

        # 5. Move the 'gh' binary to your local bin folder
        cp "gh_${VERSION}_linux_amd64/bin/gh" $BIN_DIR

        # 6. Clean up the downloaded files
        rm -rf $GH_TAR_BALL*

    - name: process-prs
      script: |
        #!/usr/bin/env bash
                
        # Cleanup temporary files on exit
        
        # 0. Init Git 
        git init -b main
        git config --global --add safe.directory /workspace
        
        trap 'rm -f pr_list.json extracted_prs.txt' EXIT
        
        STATUS_CODE_FAILED=101
        STATUS_CODE_PENDING=102
        STATUS_CODE_SKIPPED=103
        STATUS_CODE_SUCCESS=200

        # Why a PR could not be merged, reported in the final summary
        declare -A FAILURE_REASON
        # When /retest was last asked for, a PR is not retested more than once
        # every RETEST_COOLDOWN seconds
        declare -A LAST_RETEST
        RETEST_COOLDOWN=1800
        
        function list_prs(){
          ORG="openshift-pipelines"
          BASE_BRANCH=$1

          # Without a label or a head branch every open PR of the org would
          # match, refuse to process those.
          if [[ -z "$SEARCH_LABEL" && -z "$HEAD_BRANCH" ]]; then
            echo "❌ Either SEARCH_LABEL or HEAD_BRANCH has to be set"
            exit 1
          fi

          # "label:a,b" matches any of the labels, "-label:c" drops the PRs
          # carrying it. Nudge PRs are excluded from the early run that way,
          # they are only processed once the sources are updated.
          QUERY=()
          [[ -z "$SEARCH_LABEL" ]] || QUERY+=("label:$SEARCH_LABEL")
          IFS=',' read -ra EXCLUDED_LABELS <<< "$EXCLUDE_LABEL"
          for LABEL in "${EXCLUDED_LABELS[@]}"; do
            LABEL=$(echo "$LABEL" | xargs)
            [[ -n "$LABEL" ]] || continue
            QUERY+=("-label:$LABEL")
          done

          # A generated PR is targeted by its branch, it is a single PR and it
          # does not depend on the labels having been applied.
          HEAD_FILTER=()
          [[ -z "$HEAD_BRANCH" ]] || HEAD_FILTER=(--head "$HEAD_BRANCH")

          echo "🔎 Searching open PRs on $BASE_BRANCH matching: ${HEAD_FILTER[*]} ${QUERY[*]}"

          # Search for PRs and save to JSON. The query is passed after "--",
          # a "-label:" term would be read as a flag otherwise.
          gh search prs --owner "$ORG" \
          --base "$BASE_BRANCH" \
          --state open \
          "${HEAD_FILTER[@]}" \
          --json repository,url \
          -- "${QUERY[@]}" > pr_list.json
        }
        
        
        function process_pr() {
          URL=$1
          echo "Processing PR $URL"
          PR_DATA=$(gh pr view "$URL" --json state,mergeable,mergeStateStatus)
          PR_STATE=$(echo "$PR_DATA" | jq -r '.state')
          MERGEABLE=$(echo "$PR_DATA" | jq -r '.mergeable')
          MERGE_STATE=$(echo "$PR_DATA" | jq -r '.mergeStateStatus')
          REPO_NAME=$(echo "$URL" | cut -d'/' -f4,5)

            # --- SCENARIO 0: PR IS NO LONGER OPEN ---
            # The auto merge enabled on a previous round can land the PR on its
            # own, and a PR closed in the meantime is not ours to reopen.
            if [[ "$PR_STATE" == "MERGED" ]]; then
              echo "✅ PR is already merged, nothing left to do."
              unset "FAILURE_REASON[$URL]"
              return $STATUS_CODE_SUCCESS
            fi
            if [[ "$PR_STATE" == "CLOSED" ]]; then
              echo "⏭️  SKIP: PR was closed without being merged."
              unset "FAILURE_REASON[$URL]"
              return $STATUS_CODE_SKIPPED
            fi

            # --- SCENARIO 1: MERGE CONFLICTS ---
            if [[ "$MERGEABLE" == "CONFLICTING" || "$MERGE_STATE" == "DIRTY" ]]; then
              echo "⚠️ SKIP: PR has merge conflicts."
              FAILURE_REASON[$URL]="has merge conflicts, it needs a manual rebase"
              return $STATUS_CODE_FAILED
            fi
        
            # --- SCENARIO 2: REBASE / OUT-OF-DATE ISSUE ---
            if [[ "$MERGE_STATE" == "BEHIND" ]]; then
              echo "⚠️ PR is behind the base branch."
              echo "Attempting to update branch..."
              if ! gh pr update-branch "$URL" --rebase ; then
                echo "❌ SKIP: Failed to REBASE branch automatically."
                FAILURE_REASON[$URL]="could not be rebased onto $BASE_BRANCH automatically"
                return $STATUS_CODE_FAILED
              fi
              return $STATUS_CODE_PENDING
            fi
            # --- SCENARIO 3: CHECK AND CREATE MISSING LABELS ---
            IFS=',' read -ra LABEL_ARRAY <<< "$LABELS_TO_ADD"
            for LABEL in "${LABEL_ARRAY[@]}"; do
              LABEL=$(echo "$LABEL" | xargs)
              LABEL_EXISTS=$(gh label list --repo "$REPO_NAME" --search "$LABEL" --json name -q ".[] | select(.name == \"$LABEL\") | .name")
        
              if [[ -z "$LABEL_EXISTS" ]]; then
                gh label create "$LABEL" --repo "$REPO_NAME" --color "0E8A16" --description "Auto-created by pipeline"
              fi
            done
            gh pr edit "$URL" --add-label "$LABELS_TO_ADD"  2>/dev/null ||  true
        
            # --- SCENARIO 4: WORKFLOWS FAILING/PENDING ---
            echo "⏳ Checking workflows..."
            CHECKS_JSON=$(gh pr checks "$URL" --json name,bucket,link 2>&1 | grep -v "no checks reported" || true)
            if [[ -n "$CHECKS_JSON" ]]; then
              FAILING_COUNT=$(echo "$CHECKS_JSON" | jq '[.[] | select(.bucket == "fail")] | length')
              if [[ "$FAILING_COUNT" -gt 0 ]]; then
                echo "❌ PR has $FAILING_COUNT failing workflow(s)."
                NOW=$(date +%s)
                LAST=${LAST_RETEST[$URL]:-0}
                if [[ $(( NOW - LAST )) -ge $RETEST_COOLDOWN ]]; then
                  echo "   💬 Asking for a retest"
                  gh pr comment $URL --body "/retest"
                  LAST_RETEST[$URL]=$NOW
                else
                  echo "   ⏭️  Already retested $(( (NOW - LAST) / 60 ))m ago, keeping the $(( RETEST_COOLDOWN / 60 ))m gap"
                fi
                FAILURE_REASON[$URL]="has $FAILING_COUNT failing check(s) that did not recover after /retest"
                # Retried by the loop below, the retest has to get a chance
                return $STATUS_CODE_PENDING
              fi
            fi
        
            PENDING_COUNT=$(echo "$CHECKS_JSON" | jq '[.[] | select(.bucket == "pending")] | length')
            if [[ "$PENDING_COUNT" -gt 0 ]]; then
              echo "⏳ SKIP: PR has $PENDING_COUNT pending workflow(s)."
              return $STATUS_CODE_PENDING
            fi
        
            # --- SCENARIO 5: Merge PRs ---
            echo "🚢 Merging PR..."
            # Approving can legitimately fail, the token cannot approve a PR it
            # opened itself, the merge below is what matters.
            gh pr review --approve "$URL" || echo "⚠️ Could not approve, trying to merge anyway"
            if ! MERGE_OUTPUT=$(gh pr merge "$URL" -d -r --auto 2>&1); then
              echo "❌ Failed to merge: $MERGE_OUTPUT"
              FAILURE_REASON[$URL]="could not be merged: $(echo "$MERGE_OUTPUT" | tr '\n' ' ')"
              return $STATUS_CODE_FAILED
            fi
            echo "$MERGE_OUTPUT"
            unset "FAILURE_REASON[$URL]"
            return $STATUS_CODE_SUCCESS
        }
        
        function main () {
          VERSION=${1:-$VERSION}
          LABELS_TO_ADD="lgtm,approved,one-click-release"
          
          # Determine the BASE_BRANCH based on the VERSION parameter
          if [[ "$VERSION" == "next" || "$VERSION" == "nightly" || "$VERSION" == "main" ]]; then
            BASE_BRANCH="$VERSION"
          else
            BASE_BRANCH="release-v$VERSION.x"
          fi
          
        
        
          list_prs $BASE_BRANCH
        
          PR_JSON=$(cat pr_list.json)
          echo "Extracting PRs from JSON..."
        
          # 2. Extract REPO_NAME (needed for checking labels) and URL (used for all PR actions)
          echo "$PR_JSON" | jq -r '.[] | "\(.url)"' > extracted_prs.txt
        
          declare -a FAILING_PRS=()
          declare -a SUCCESS_PRS=()
          declare -a PENDING_PRS=()
          declare -a SKIPPED_PRS=()

          while read -r URL; do
            echo "------------------------------------------------"
            echo "🚀 Processing PR: $URL"
            process_pr $URL
            local STATUS=$?
            echo "STATUS : $STATUS"
            case $STATUS in
              $STATUS_CODE_FAILED) FAILING_PRS+=("$URL") ;;
              $STATUS_CODE_PENDING) PENDING_PRS+=("$URL") ;;
              $STATUS_CODE_SKIPPED) SKIPPED_PRS+=("$URL") ;;
              $STATUS_CODE_SUCCESS) SUCCESS_PRS+=("$URL") ;;
            esac
          done < extracted_prs.txt
        
          # ==============================================================================
            # --- RETRY PENDING PRS (1 Hour Limit, 1 Min Interval) ---
            # ==============================================================================
        
            local MAX_RETRIES=60
            local RETRY_COUNT=0
            local SLEEP_INTERVAL=60
        
            while [[ ${#PENDING_PRS[@]} -gt 0 && $RETRY_COUNT -lt $MAX_RETRIES ]]; do
              ((RETRY_COUNT++))
              echo ""
              echo "================================================"
              echo "⏳ Retry loop $RETRY_COUNT/$MAX_RETRIES. Sleeping for ${SLEEP_INTERVAL}s..."
              echo "================================================"
              sleep "$SLEEP_INTERVAL"
        
              # Temporary array to hold PRs that remain pending during this iteration
              local STILL_PENDING_PRS=()
        
              for URL in "${PENDING_PRS[@]}"; do
                echo "------------------------------------------------"
                echo "🔄 Retrying PR: $URL"
        
                process_pr "$URL"
                local STATUS=$?
        
                case $STATUS in
                  $STATUS_CODE_FAILED) FAILING_PRS+=("$URL") ;;
                  $STATUS_CODE_PENDING) STILL_PENDING_PRS+=("$URL") ;;
                  $STATUS_CODE_SKIPPED) SKIPPED_PRS+=("$URL") ;;
                  $STATUS_CODE_SUCCESS) SUCCESS_PRS+=("$URL") ;;
                esac
              done
        
              # Overwrite the pending array with the ones that are STILL pending
              PENDING_PRS=("${STILL_PENDING_PRS[@]}")
            done
        
          # ==============================================================================
          # --- FINAL SUMMARY ---
          # ==============================================================================
        
          echo ""
          echo "================================================"
          echo "✅ Pipeline Complete!"
          echo "================================================"
          echo "✅ Successful PRs: ${SUCCESS_PRS[*]}"
          echo "❌ Failed PRs:     ${FAILING_PRS[*]}"
          if [[ ${#SKIPPED_PRS[@]} -gt 0 ]]; then
            echo "⏭️  Skipped PRs:    ${SKIPPED_PRS[*]} (closed without being merged)"
          fi
          if [[ ${#PENDING_PRS[@]} -gt 0 ]]; then
            echo "⏳ Pending PRs:    ${PENDING_PRS[*]}"
          fi

          # Every PR has to be merged, the next steps of the release build on
          # top of them. Stop here instead of releasing a stale snapshot.
          if [[ ${#FAILING_PRS[@]} -gt 0 || ${#PENDING_PRS[@]} -gt 0 ]]; then
            echo ""
            echo "================================================"
            echo "❌ ERROR: $(( ${#FAILING_PRS[@]} + ${#PENDING_PRS[@]} )) PR(s) could not be processed"
            echo "================================================"
            for URL in "${FAILING_PRS[@]}"; do
              echo "   ❌ $URL ${FAILURE_REASON[$URL]:-could not be merged}"
            done
            for URL in "${PENDING_PRS[@]}"; do
              echo "   ⏳ $URL ${FAILURE_REASON[$URL]:-still had running checks} (gave up after $(( MAX_RETRIES * SLEEP_INTERVAL / 60 )) minutes)"
            done
            echo ""
            echo "Merge them manually, or rerun the pipeline once they are green."
            return 1
          fi
        }

        main

