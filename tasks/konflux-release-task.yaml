apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: konflux-release-task
spec:
  params:
    - name: VERSION
      type: string
    - name: APPLICATION
      type: string
    - name: ENVIRONMENT
      type: string
  results:
    - name: application
      description: The release plan name
      value: $(steps.get-application.results.application)
    - name: release-plan
      description: The release plan name
      value: $(steps.get-release-plan.results.release-plan)
    - name: snapshot
      description: The snapshot name
      value: $(steps.get-snapshot.results.snapshot)
    - name: release
      description: The created release name
      value: $(steps.create-release.results.release)

  stepTemplate:
    image: quay.io/openshift-pipeline/ci
    env:
      - name: APPLICATION
        value: $(params.APPLICATION)
      - name: ENVIRONMENT
        value: $(params.ENVIRONMENT)
      - name: VERSION
        value: $(params.VERSION)
  steps:
    - name: get-application
      results:
        - name: application
          type: array
      script: |
        application=$(oc get application -o json | jq  -r --arg APP $APPLICATION  --arg VERSION ${VERSION//./-}  '
            .items[] 
            | select(.metadata.name  | contains($APP) and contains($VERSION)) 
            |.metadata.name
        '
        )
        echo -n $application | tee $(step.results.application.path)

    - name: get-release-plan
      results:
        - name: release-plan
      env:
        - name: APPLICATION
          value: $(steps.get-application.results.application)
      script: |
        
        
        echo "APPLICATION : $APPLICATION"
        
        VERSION_PLAN=$(oc get releaseplan -o json | jq -r --arg APP $APPLICATION --arg ENVX $ENVIRONMENT '
          [
           .items[]
           | select(.spec.application == $APP and (.metadata.name | contains($ENVX)))
           |.metadata.name
          ]
          |.[-1]'
        )
        echo -n "$VERSION_PLAN" | tee $(step.results.release-plan.path)

    - name: get-snapshot
      results:
        - name: snapshot
      env:
        - name: APPLICATION
          value: $(steps.get-application.results.application)
      script: |
        LATEST_SNAPSHOT=$(
        kubectl get snapshots \
          -l "pac.test.appstudio.openshift.io/event-type=push,appstudio.openshift.io/application=${APPLICATION}" \
          --sort-by=.metadata.creationTimestamp \
          -o jsonpath='{.items[*].metadata.name}' | awk '{print $NF}')

        echo -n "$LATEST_SNAPSHOT" | tee $(step.results.snapshot.path)

    - name: create-release
      results:
        - name: release
      env:
        - name: VERSION_PLAN
          value: $(steps.get-release-plan.results.release-plan)
        - name: SNAPSHOT
          value: $(steps.get-snapshot.results.snapshot)
      script: |
        set -x

        echo "Check if there is existing release!!"
        VERSION_NAME=$(oc get releases \
          -l "release.appstudio.openshift.io/releasePlan=$VERSION_PLAN,release.appstudio.openshift.io/snapshot=$SNAPSHOT" \
          -o json | jq -r '.items[]
          | . as $item
          | ($item.status.conditions[]? | select(.type=="Released")) as $cond
          | select( ($cond.status == "True") or ($cond.status == "False" and ($cond.reason // "") != "Failed"))
          | $item.metadata.name '| head -n1 )

        if [[ -z $VERSION_NAME ]]; then
          VERSION_YAML=/tmp/release.yaml
          cat <<EOF > $VERSION_YAML
        apiVersion: appstudio.redhat.com/v1alpha1
        kind: Release
        metadata:
          generateName: release-$VERSION_PLAN-
        spec:
          releasePlan: $VERSION_PLAN
          snapshot: $SNAPSHOT
        EOF

          cat $VERSION_YAML
          VERSION_NAME=$(kubectl create -f $VERSION_YAML -o jsonpath='{.metadata.name}')
        fi

        echo -n "$VERSION_NAME" | tee $(step.results.release.path)

    - name: wait-for-release
      env:
        - name: APPLICATION
          value: $(steps.get-application.results.application)
        - name: VERSION_PLAN
          value: $(steps.get-release-plan.results.release-plan)
        - name: SNAPSHOT
          value: $(steps.get-snapshot.results.snapshot)
        - name: VERSION_NAME
          value: $(steps.create-release.results.release)
      script: |
        echo "Check the Release Status for: $VERSION_NAME"

        release_status=$(
          kubectl get release "$VERSION_NAME" -o json | jq -r '.status.conditions[]?
            | select(.type == "Released")
            | .status'
        )
        echo "Status: $release_status"

        if [[ "$release_status" == "True" ]]; then
          echo "$APPLICATION Release is Done on $ENVIRONMENT"
          kubectl get release "$VERSION_NAME" -o json | jq '.status.artifacts.advisory'
        else
          echo "Waiting for PipelineRun to be assigned to Release: $VERSION_NAME..."
          while true; do
            # Attempt to extract the PipelineRun name from the Release status
            export PIPELINERUN=$(kubectl get release "$VERSION_NAME" -o jsonpath='{.status.managedProcessing.pipelineRun}' 2>/dev/null)

            # Check if the extracted string is not empty
            if [ -n "$PIPELINERUN" ]; then
              echo "Success! PipelineRun found: $PIPELINERUN"
              break
            fi
            echo "PipelineRun Not yet Added. Retrying in 5s..."
            sleep 5
          done

          tkn -n "${PIPELINERUN%%/*}" pr logs -f "${PIPELINERUN##*/}"

          echo "Check Pipeline Run Status"
          PIPELINERUN_STATUS=$(oc -n "${PIPELINERUN%%/*}" get pr "${PIPELINERUN##*/}" -o jsonpath="{.status.conditions[?(@.type=='Succeeded')]}")

          SUCCESS=$(echo "$PIPELINERUN_STATUS" | jq -r '.status')
          MESSAGE=$(echo "$PIPELINERUN_STATUS" | jq -r '.message')

          if [[ "$SUCCESS" == "False" ]]; then
            echo "PipelineRun $PIPELINERUN Failed: $MESSAGE"
            exit 1 # Added an exit status to fail the Task properly if PR fails
          else
            echo "PipelineRun $PIPELINERUN Succeeded"
          fi
        fi